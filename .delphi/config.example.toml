# ─────────────────────────────────────────────────────────────────────────────
# DELPHI WORKSPACE CONFIGURATION TEMPLATE (.delphi/config.example.toml)
# Copy to .delphi/config.local.toml for operator-specific settings (gitignored)
# ─────────────────────────────────────────────────────────────────────────────

[workspace]
name = "delphi"
default_mode = "orchestrator" # orchestrator | council

[tui]
operator_identity = "chaos"
narrator_identity = "homer"
auto_spawn_homer = false      # Set true for automatic dual-window on launch
frame_rate_hz = 60

[providers.anthropic]
enabled = true
api_key_env = "ANTHROPIC_API_KEY"
frontier_model = "claude-opus-4-6"
workhorse_model = "claude-sonnet-4-6"
fast_model = "claude-haiku-4-5"
enable_ephemeral_cache = true

[providers.google]
enabled = true
api_key_env = "GEMINI_API_KEY"
frontier_model = "gemini-3-pro"
workhorse_model = "gemini-3-flash"
fast_model = "gemini-3-flash-lite"
enable_context_cache = true

[routing]
enable_dynamic_scaling = true
cross_provider_builder_critic = true # [H-007] Pair Claude builder with Gemini critic
one_strike_retry_upscale = true      # [H-007] Auto-upscale tier/thinking on failed check

[rag]
engine = "sqlite-hybrid"             # SQLite FTS5 BM25 + sqlite-vec + RRF
max_pointer_results = 10
exclude_untrusted_by_default = true

[federation]
enabled = false
transport = "tailscale"              # tailscale | ssh-uds | mdns
default_peer_trust_ceiling = "federated_peer"
