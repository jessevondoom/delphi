name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Repo lint
        run: cargo run -q --locked -p delphi -- lint --repo .
      - name: Training cases are well formed
        run: cargo run -q --locked -p delphi -- train validate
      - name: Golden org bundle validates
        run: cargo run -q --locked -p delphi -- bundle validate dev/bundles/acme-platform --claude
      - name: Benchmark runner self-test
        run: python3 -I dev/bench/bench.py self-test
      - name: Model availability script self-test
        run: python3 -I dev/train/avail.py self-test

  # The Rust dependency policy (spec 093 P, deny.toml): known vulnerabilities, yanked crates, licences, sources. The tool is
  # built at a fixed version from crates.io, not fetched through a third-party action, and it reads the advisory database
  # fresh, so a new advisory turns the next run red. An exception in deny.toml carries a reason and a review date.
  deny:
    name: dependency policy (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Install cargo-deny (pinned)
        run: |
          # The crate download can fail for a moment; 3 attempts, 20 seconds apart.
          for attempt in 1 2 3; do
            if cargo install --locked cargo-deny --version 0.20.2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "cargo install failed after 3 attempts"
              exit 1
            fi
            echo "cargo install failed (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done
      - name: Check
        run: cargo deny --locked check

  # The full-screen console (D-28): typecheck, unit tests, and the dependency gate. Runners ship Node.
  ui:
    name: ui (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.4.0
      - run: node --version
      - name: Install (pinned, no install scripts)
        run: |
          # A download from the npm registry can fail for a moment; 3 attempts, 20 seconds apart.
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --no-audit --no-fund; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            echo "npm ci failed (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done
      - name: Dependency gate
        run: npm run check-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Against the real daemon (pty end to end, from source)
        working-directory: .
        env:
          DELPHI_REQUIRE_UI: "1"
        run: cargo test --locked -p delphi --test e2e -- full_screen esc_stops hands_over decision_inbox full_screen_observer research_panels terminal_is_given_back survives_a_daemon_restart
      - name: Build the executable exactly as the release does
        run: |
          v="$(awk '/^\[package\]/{f=1} f && /^version/{gsub(/"/,"",$3); print $3; exit}' ../crates/delphi/Cargo.toml)"
          dev/build.sh "$v" "$PWD/dist/delphi-ui"
          ./dist/delphi-ui --version
      - name: Against the real daemon (pty end to end, with the compiled executable)
        working-directory: .
        env:
          DELPHI_UI_COMPILED: ${{ github.workspace }}/ui/dist/delphi-ui
          DELPHI_REQUIRE_UI: "1"
        run: cargo test --locked -p delphi --test e2e -- full_screen esc_stops decision_inbox full_screen_observer research_panels terminal_is_given_back survives_a_daemon_restart

  # The Linux sandbox (bubblewrap) is only exercised where it exists: install it, allow unprivileged user
  # namespaces (Ubuntu 24.04 restricts them by default), and require the sandbox tests to really run.
  linux-sandbox:
    name: linux sandbox (bubblewrap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The bubblewrap package, kept between runs. A run that installs it from a mirror saves it; later runs install
      # from the cache and never touch Ubuntu's servers. Bump the -v1 suffix to refresh it. A cache saved on a
      # pull-request branch is seen only by that branch; main's is seen by all, so it is filled after the first
      # green run on main.
      - name: Restore the bubblewrap package
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/bwrap-debs
          key: bubblewrap-deb-ubuntu-24.04-v1
      - name: Install bubblewrap and allow user namespaces
        run: |
          # Ubuntu's package hosts (azure.archive.ubuntu.com, archive.ubuntu.com) have failed to resolve from the runners
          # for an hour at a time, so no single Ubuntu domain can be relied on. Order: the cached package; then apt on the
          # runner's own mirror; then, after each failure, a mirror on an unrelated domain (kernel.org, berkeley.edu,
          # leaseweb.net) and, from the second retry, public DNS resolvers. At most 3 retries (4 attempts), 20 seconds
          # apart, with short timeouts so a dead host costs seconds. apt checks every package's signature on any mirror.
          mkdir -p "$HOME/bwrap-debs"
          APT_OPTS="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0"

          use_mirror() {
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              if [ -f "$f" ]; then
                sudo sed -i -E "s#mirror\+file:/etc/apt/apt-mirrors\.txt#$1#g; s#https?://[a-z0-9.-]+/ubuntu/?#$1#g" "$f"
              fi
            done
          }
          use_public_dns() {
            iface="$(ip route show default | awk '{print $5; exit}')"
            if [ -n "$iface" ] && command -v resolvectl >/dev/null 2>&1; then
              sudo resolvectl dns "$iface" 1.1.1.1 8.8.8.8 || true
              sudo resolvectl flush-caches || true
            fi
          }
          diagnose() {
            echo "--- name resolution on this runner"
            for h in archive.ubuntu.com azure.archive.ubuntu.com mirrors.edge.kernel.org mirrors.ocf.berkeley.edu github.com registry.npmjs.org; do
              if getent hosts "$h" >/dev/null 2>&1; then echo "resolves:        $h"; else echo "does NOT resolve: $h"; fi
            done
            resolvectl status 2>&1 | head -20 || true
            echo "---"
          }

          if command -v bwrap >/dev/null 2>&1; then
            echo "bwrap is already installed"
          elif ls "$HOME"/bwrap-debs/bubblewrap_*.deb >/dev/null 2>&1 && sudo dpkg -i "$HOME"/bwrap-debs/bubblewrap_*.deb; then
            echo "installed bubblewrap from the cached package"
          else
            for attempt in 1 2 3 4; do
              if sudo apt-get $APT_OPTS update -qq && sudo apt-get $APT_OPTS install -y -qq bubblewrap; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                diagnose
                echo "apt could not install bubblewrap after 3 retries"
                exit 1
              fi
              case "$attempt" in
                1) diagnose; echo "switching apt to mirrors.edge.kernel.org"; use_mirror https://mirrors.edge.kernel.org/ubuntu/ ;;
                2) use_public_dns; diagnose; echo "switching apt to mirrors.ocf.berkeley.edu"; use_mirror https://mirrors.ocf.berkeley.edu/ubuntu/ ;;
                3) echo "switching apt to mirror.us.leaseweb.net"; use_mirror https://mirror.us.leaseweb.net/ubuntu/ ;;
              esac
              echo "apt failed (attempt $attempt of 4); retrying in 20s"
              sleep 20
            done
            # keep the package for the cache above
            cp /var/cache/apt/archives/bubblewrap_*.deb "$HOME/bwrap-debs/" 2>/dev/null \
              || (cd "$HOME/bwrap-debs" && sudo apt-get $APT_OPTS download bubblewrap) || true
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --unshare-all --die-with-parent true && echo "bwrap works here"
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Sandbox tests must run, not skip
        env:
          DELPHI_REQUIRE_SANDBOX: "1"
        run: |
          cargo test --locked -p delphi-sandbox -p delphi-engine -- sandbox 'authorized::' 'exec::' harness_run 'build::' 'finalize::'
