name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` starts the full run (macOS included) when a draft is marked ready; see the macOS job.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. A push to main is never cancelled: each main run gets
# its own group (the commit), because a group also cancels a run that is still PENDING when a newer one arrives, even with
# cancel-in-progress off. Two merges a minute apart were leaving the first main run cancelled (a red mark, and no cache saved).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repo's own lean build settings (AGENTS.md): a fresh checkout gains nothing from incremental compilation, and the tests
# do not read debug info (panic locations and symbol names stay). This only affects the dev profile; the release build of
# the console executable below is unchanged.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Linux tests, in two jobs that together run exactly what `cargo test --workspace --locked` runs (the AGENTS.md gate):
  # that command runs each package's library unit tests, then its binaries' unit tests, then its integration tests, then
  # its doc tests. Here the first job runs `--lib`; the second runs `--bins --test '*'` (every integration test file) and
  # then `--doc`. `--tests` is not used because it would run the library tests a second time. The union was compared with
  # `cargo test --workspace -- --list` when this was written (same test count); if a new kind of target is ever added
  # (an example with `test = true`, a bench), add it to one of the two.
  test-linux-lib:
    name: test linux (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore the build directory
        id: target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-unit-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-unit-
            cargo-target-${{ runner.os }}-test-
      - name: Test (library unit tests)
        run: cargo test --workspace --locked --lib
      - name: Save the build directory
        if: github.event_name == 'push' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-unit-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}

  test-linux-integration:
    name: test linux (integration, bins, doc)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore the build directory
        id: target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-integ-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-integ-
            cargo-target-${{ runner.os }}-test-
      # Cheap static checks first (milliseconds each once built), so a broken spec reference is reported minutes
      # before the long tests finish. They run again in the full step below; that costs nothing.
      - name: Static checks (spec references, compiled specs)
        run: cargo test --locked -p delphi --test spec_refs --test compiled_specs
      - name: Test (binaries and integration tests)
        run: cargo test --workspace --locked --bins --test '*'
      - name: Test (doc tests)
        run: cargo test --workspace --locked --doc
      - name: Save the build directory
        if: github.event_name == 'push' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-integ-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}

  # macOS: one job per run (the account may run only 5 macOS jobs at once). The full workspace tests, then Clippy, so
  # code behind `cfg(target_os = "macos")` is tested and checked where it compiles. Clippy runs even when the tests fail.
  # The repo lint and the data checks that do not depend on the system run once, in the Linux `lint` job.
  #
  # Once per pull request, on the head that is ready: while a pull request is a DRAFT this job is skipped (every push to a
  # draft used to take a scarce macOS slot for ~25 minutes). GitHub cannot merge a draft, and marking it ready fires
  # `ready_for_review`, which runs this job on that head; every later push to a ready pull request runs it again. So no
  # pull request merges without the full macOS gates on its final head. Pushes to main always run it. The Linux jobs run
  # on every push, draft or not.
  test-macos:
    name: macos (test + clippy)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore the build directory
        id: target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-test-
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Benchmark runner self-test
        if: success() || failure()
        run: python3 -I dev/bench/bench.py self-test
      - name: Model availability script self-test
        if: success() || failure()
        run: python3 -I dev/train/avail.py self-test
      - name: Save the build directory
        if: success() && github.event_name == 'push' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}

  # Clippy, the repo lint and the data checks, on Linux. (Clippy also runs on macOS, in the job above.) The checks that
  # used to follow the tests in the `test` job (training cases, the golden bundle) are here, so they no longer rebuild
  # the program on the long path.
  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore the build directory
        id: target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-lint-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Repo lint
        run: cargo run -q --locked -p delphi -- lint --repo .
      - name: Training cases are well formed
        run: cargo run -q --locked -p delphi -- train validate
      - name: Golden org bundle validates
        run: cargo run -q --locked -p delphi -- bundle validate dev/bundles/acme-platform --claude
      - name: Benchmark runner self-test
        run: python3 -I dev/bench/bench.py self-test
      - name: Model availability script self-test
        run: python3 -I dev/train/avail.py self-test
      - name: Save the build directory
        if: github.event_name == 'push' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}

  # The Rust dependency policy (spec 093 P, deny.toml): known vulnerabilities, yanked crates, licences, sources. The tool is
  # built at a fixed version from crates.io, not fetched through a third-party action, and it reads the advisory database
  # fresh, so a new advisory turns the next run red. An exception in deny.toml carries a reason and a review date.
  deny:
    name: dependency policy (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      # The binary is kept between runs (building it took 114 s of the job's 130 s). The key names the version: change the
      # version below and in the key together. A cache saved on a pull-request branch is seen only by that branch; main's
      # is seen by all.
      - name: Restore cargo-deny
        id: deny
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-${{ runner.os }}-0.20.2
      - name: Install cargo-deny (pinned)
        if: steps.deny.outputs.cache-hit != 'true'
        run: |
          # The crate download can fail for a moment; 3 attempts, 20 seconds apart.
          for attempt in 1 2 3; do
            if cargo install --locked cargo-deny --version 0.20.2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "cargo install failed after 3 attempts"
              exit 1
            fi
            echo "cargo install failed (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done
      - name: Check
        run: |
          cargo deny --version
          cargo deny --locked check

  # The full-screen console (D-28): typecheck, unit tests, and the dependency gate. Runners ship Node.
  ui:
    name: ui (node)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.4.0
      - run: node --version
      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore the build directory
        id: target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-ui-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-ui-
      - name: Install (pinned, no install scripts)
        run: |
          # A download from the npm registry can fail for a moment; 3 attempts, 20 seconds apart.
          for attempt in 1 2 3; do
            if npm ci --ignore-scripts --no-audit --no-fund; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            echo "npm ci failed (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done
      - name: Dependency gate
        run: npm run check-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Against the real daemon (pty end to end, from source)
        working-directory: .
        env:
          DELPHI_REQUIRE_UI: "1"
        run: cargo test --locked -p delphi --test e2e -- full_screen esc_stops hands_over decision_inbox full_screen_observer research_panels terminal_is_given_back survives_a_daemon_restart
      - name: Build the executable exactly as the release does
        run: |
          v="$(awk '/^\[package\]/{f=1} f && /^version/{gsub(/"/,"",$3); print $3; exit}' ../crates/delphi/Cargo.toml)"
          dev/build.sh "$v" "$PWD/dist/delphi-ui"
          ./dist/delphi-ui --version
      - name: Against the real daemon (pty end to end, with the compiled executable)
        working-directory: .
        env:
          DELPHI_UI_COMPILED: ${{ github.workspace }}/ui/dist/delphi-ui
          DELPHI_REQUIRE_UI: "1"
        run: cargo test --locked -p delphi --test e2e -- full_screen esc_stops decision_inbox full_screen_observer research_panels terminal_is_given_back survives_a_daemon_restart
      - name: Save the build directory
        if: github.event_name == 'push' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-ui-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}

  # The Linux sandbox (bubblewrap) is only exercised where it exists: install it, allow unprivileged user
  # namespaces (Ubuntu 24.04 restricts them by default), and require the sandbox tests to really run.
  linux-sandbox:
    name: linux sandbox (bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The bubblewrap package, kept between runs. A run that installs it from a mirror saves it; later runs install
      # from the cache and never touch Ubuntu's servers. Bump the -v1 suffix to refresh it. A cache saved on a
      # pull-request branch is seen only by that branch; main's is seen by all, so it is filled after the first
      # green run on main.
      - name: Restore the bubblewrap package
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/bwrap-debs
          key: bubblewrap-deb-ubuntu-24.04-v1
      - name: Install bubblewrap and allow user namespaces
        run: |
          # Ubuntu's package hosts (azure.archive.ubuntu.com, archive.ubuntu.com) have failed to resolve from the runners
          # for an hour at a time. On 2026-11-11 the cause was the runner's DNS server (168.63.129.16) failing for Ubuntu's
          # names only; the same names resolved through public resolvers. Order: the cached package; apt on the runner's
          # own mirror; after the first failure, public DNS resolvers; after the next, a mirror on an unrelated domain
          # (kernel.org, then berkeley.edu). At most 3 retries (4 attempts), 20 seconds apart, with short timeouts so a dead
          # host costs seconds. apt checks every package's signature on any mirror.
          mkdir -p "$HOME/bwrap-debs"
          APT_OPTS="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=0"

          use_mirror() {
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              if [ -f "$f" ]; then
                # Only a URL that ends at /ubuntu/ is a package mirror; others such as packages.microsoft.com/ubuntu/24.04/prod stay.
                sudo sed -i -E "s#mirror\+file:/etc/apt/apt-mirrors\.txt#$1#g; s#https?://[a-z0-9.-]+/ubuntu/?([[:space:]]|\$)#$1\1#g" "$f"
              fi
            done
          }
          use_public_dns() {
            iface="$(ip route show default | awk '{print $5; exit}')"
            if [ -n "$iface" ] && command -v resolvectl >/dev/null 2>&1; then
              sudo resolvectl dns "$iface" 1.1.1.1 8.8.8.8 || true
              sudo resolvectl flush-caches || true
            fi
          }
          diagnose() {
            echo "--- name resolution on this runner"
            for h in archive.ubuntu.com azure.archive.ubuntu.com mirrors.edge.kernel.org mirrors.ocf.berkeley.edu github.com registry.npmjs.org; do
              if getent hosts "$h" >/dev/null 2>&1; then echo "resolves:        $h"; else echo "does NOT resolve: $h"; fi
            done
            resolvectl status 2>&1 | head -20 || true
            echo "---"
          }

          if command -v bwrap >/dev/null 2>&1; then
            echo "bwrap is already installed"
          elif ls "$HOME"/bwrap-debs/bubblewrap_*.deb >/dev/null 2>&1 && sudo dpkg -i "$HOME"/bwrap-debs/bubblewrap_*.deb; then
            echo "installed bubblewrap from the cached package"
          else
            for attempt in 1 2 3 4; do
              if sudo apt-get $APT_OPTS update -qq && sudo apt-get $APT_OPTS install -y -qq bubblewrap; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                diagnose
                echo "apt could not install bubblewrap after 3 retries"
                exit 1
              fi
              case "$attempt" in
                1) diagnose; echo "pointing the runner at public DNS resolvers"; use_public_dns; diagnose ;;
                2) echo "switching apt to mirrors.edge.kernel.org"; use_mirror https://mirrors.edge.kernel.org/ubuntu/ ;;
                3) echo "switching apt to mirrors.ocf.berkeley.edu"; use_mirror https://mirrors.ocf.berkeley.edu/ubuntu/ ;;
              esac
              echo "apt failed (attempt $attempt of 4); retrying in 20s"
              sleep 20
            done
            # keep the package for the cache above
            cp /var/cache/apt/archives/bubblewrap_*.deb "$HOME/bwrap-debs/" 2>/dev/null \
              || (cd "$HOME/bwrap-debs" && sudo apt-get $APT_OPTS download bubblewrap) || true
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --unshare-all --die-with-parent true && echo "bwrap works here"
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      - name: Cache the Cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Restore the build directory
        id: target
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-sandbox-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-sandbox-
      - name: Sandbox tests must run, not skip
        env:
          DELPHI_REQUIRE_SANDBOX: "1"
        run: |
          cargo test --locked -p delphi-sandbox -p delphi-engine -- sandbox 'authorized::' 'exec::' harness_run 'build::' 'finalize::'
      - name: Save the build directory
        if: github.event_name == 'push' && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-sandbox-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
