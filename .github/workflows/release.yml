name: release

# Push a tag like v0.2.0 (it must match the version in crates/delphi/Cargo.toml and be a commit on main) to build,
# publish and attest binaries for macOS (arm64, x86_64) and Linux (x86_64, arm64). A separate job then updates the
# Homebrew formula on main. Actions are pinned to commit SHAs; the Rust toolchain is pinned by rust-toolchain.toml.
#
# Run it by hand (Actions > release > Run workflow) for a dry run: the models are fetched and packed, the preloaded
# vectors are made and checked, all four executables are built with the models compiled in and smoke-tested where
# they can run, and nothing is published, attested or written to main. Do this before tagging.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The embedding model (specs/004 §3.5): fetched at a pinned revision with checked sums, packed once, and
  # compiled into every executable. Its artifact has no hyphen in its name so that `publish` does not collect it.
  model:
    name: models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch, check and pack the embedding model
        run: dev/fetch-model.sh embed "$RUNNER_TEMP/embed.dlphmdl"
      - name: Fetch, check and pack the reranking model
        run: dev/fetch-model.sh rerank "$RUNNER_TEMP/rerank.dlphmdl"
      # Preloaded vectors for the shipped documents; the script fails if the cache does not cover them.
      - name: Preloaded vectors for the shipped documents
        run: dev/build-seed-vectors.sh "$RUNNER_TEMP/embed.dlphmdl" "$RUNNER_TEMP/seed.dlphvec"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: embedmodel
          path: |
            ${{ runner.temp }}/embed.dlphmdl
            ${{ runner.temp }}/rerank.dlphmdl
            ${{ runner.temp }}/seed.dlphvec
          compression-level: 0

  # Sign the manifest of the files this build ships with the maintainers' release key (specs/036), once, for every target. With no
  # RELEASE_SIGNING_KEY secret the file is `{}` and the build is unsigned, as it always was. With one, `verify` below fails the
  # workflow unless the key's public id is in release-keys.json (a change that needs the maintainers' review) and the signature
  # holds over exactly these files and this version.
  sign:
    name: sign the release files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo '{}' > release.sig.json
            echo "no release key is configured: this build is unsigned"
            exit 0
          fi
          umask 077
          keydir="$RUNNER_TEMP/release-key"
          mkdir -p "$keydir"
          chmod 700 "$keydir"
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$keydir/release.key"
          cargo run -q --locked -p delphi-release -- sign --key "$keydir/release.key" --out release.sig.json
          rm -rf "$keydir"
          cargo run -q --locked -p delphi-release -- verify --sig release.sig.json --keys release-keys.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: releasesig
          path: release.sig.json

  build:
    name: build (${{ matrix.target }})
    needs: [model, sign]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # `native` marks the targets whose executable can run on its own runner, for the smoke test below.
          - { os: macos-15, target: aarch64-apple-darwin, bun: bun-darwin-arm64, native: true }
          - { os: macos-15, target: x86_64-apple-darwin, bun: bun-darwin-x64, native: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bun: bun-linux-x64, native: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bun: bun-linux-arm64, native: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tagged commit must be on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not a commit on main"; exit 1; }
      - name: Tag must match the crate version
        if: github.event_name == 'push'
        run: |
          v="$(awk '/^\[package\]/{f=1} f && /^version/{gsub(/"/,"",$3); print $3; exit}' crates/delphi/Cargo.toml)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match crate version $v"; exit 1; }
      # A tag names the release; a dry run takes its version from the crate.
      - name: Release version
        id: ver
        run: |
          v="$(awk '/^\[package\]/{f=1} f && /^version/{gsub(/"/,"",$3); print $3; exit}' crates/delphi/Cargo.toml)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: embedmodel
          path: ${{ runner.temp }}/model
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releasesig
          path: ${{ runner.temp }}/releasesig
      - name: Put the release signature in the build
        run: cp "$RUNNER_TEMP/releasesig/release.sig.json" crates/delphi/release.sig.json
      - name: Build
        env:
          DELPHI_EMBED_MODEL_FILE: ${{ runner.temp }}/model/embed.dlphmdl
          DELPHI_RERANK_MODEL_FILE: ${{ runner.temp }}/model/rerank.dlphmdl
          DELPHI_SEED_VECTORS_FILE: ${{ runner.temp }}/model/seed.dlphvec
        run: cargo build --release --locked --target ${{ matrix.target }} -p delphi --features embedded-model
      # What the executable can do on a machine with nothing installed beside it: both models load and run, the
      # preloaded vectors match the embedder, and a fresh workspace answers a question in other words on its first
      # search. Cross-built targets are only built (their executable cannot run here).
      - name: Smoke test the executable
        if: matrix.native
        run: |
          d="target/${{ matrix.target }}/release/delphi"
          "$d" --version
          "$d" kb model info --check | tee "$RUNNER_TEMP/info.txt"
          grep -q "embedding model: .*compiled into this binary" "$RUNNER_TEMP/info.txt"
          grep -q "reranking model: .*compiled into this binary" "$RUNNER_TEMP/info.txt"
          grep -q "preloaded vectors: [1-9]" "$RUNNER_TEMP/info.txt"
          mkdir -p "$RUNNER_TEMP/proj"
          (cd "$RUNNER_TEMP/proj" && printf 'smoke\n\n' | "$GITHUB_WORKSPACE/$d" init --home "$RUNNER_TEMP/home" >/dev/null)
          "$d" kb search what stops one model family from reviewing its own work --home "$RUNNER_TEMP/home" --workspace smoke | tee "$RUNNER_TEMP/search.txt"
          grep -q "heuristics.md" "$RUNNER_TEMP/search.txt"
      # The full-screen console: one standalone executable (the JS runtime is compiled in), built for this target.
      - name: Build the console
        working-directory: ui
        run: |
          # Install scripts stay off for everything, except bun's own, which build.sh runs. It installs the target's
          # OpenTUI native package and leaves the other platforms external. The release version is baked in: a console
          # of another release refuses to run beside this delphi.
          dev/build.sh "${{ steps.ver.outputs.version }}" dist/delphi-ui ${{ matrix.bun }}
          test -x dist/delphi-ui
      - name: Package
        run: |
          name="delphi-${{ steps.ver.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/delphi" ui/dist/delphi-ui LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The tagged commit, not main: install.sh is released exactly as it was tagged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/install.sh
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  formula:
    # Its own job: the only one that can write to main, and it runs no third-party action.
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"; ver="${tag#v}"
          mkdir -p dist
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            gh release download "$tag" --pattern "delphi-$tag-$t.tar.gz.sha256" --dir dist
          done
          sum() { s="$(cut -d' ' -f1 "dist/delphi-$tag-$1.tar.gz.sha256")"; printf '%s' "$s" | grep -Eq '^[0-9a-f]{64}$' || { echo "bad checksum for $1"; exit 1; }; printf '%s' "$s"; }
          url() { echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/delphi-$tag-$1.tar.gz"; }
          mkdir -p Formula
          {
            echo 'class Delphi < Formula'
            echo '  desc "Terminal-first multi-agent working environment"'
            echo "  homepage \"https://github.com/$GITHUB_REPOSITORY\""
            echo "  version \"$ver\""
            echo '  license "MIT"'
            echo
            echo '  on_macos do'
            echo '    on_arm do'; echo "      url \"$(url aarch64-apple-darwin)\""; echo "      sha256 \"$(sum aarch64-apple-darwin)\""; echo '    end'
            echo '    on_intel do'; echo "      url \"$(url x86_64-apple-darwin)\""; echo "      sha256 \"$(sum x86_64-apple-darwin)\""; echo '    end'
            echo '  end'
            echo '  on_linux do'
            echo '    on_arm do'; echo "      url \"$(url aarch64-unknown-linux-gnu)\""; echo "      sha256 \"$(sum aarch64-unknown-linux-gnu)\""; echo '    end'
            echo '    on_intel do'; echo "      url \"$(url x86_64-unknown-linux-gnu)\""; echo "      sha256 \"$(sum x86_64-unknown-linux-gnu)\""; echo '    end'
            echo '  end'
            echo
            echo '  def install'
            echo '    bin.install "delphi", "delphi-ui"'
            echo '  end'
            echo
            echo '  test do'
            echo '    assert_match version.to_s, shell_output("#{bin}/delphi --version")'
            echo '  end'
            echo 'end'
          } > Formula/delphi.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/delphi.rb
          git commit -m "brew: delphi $ver" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
