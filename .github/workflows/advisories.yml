name: advisories

# The checks of the dependency policy that depend on outside events (spec 093 item P, amendment 093-A1): a new RustSec
# advisory, and an exception in deny.toml whose review date has passed. Pull requests that do not touch the dependencies
# skip them (ci.yml), so they run here once a day and on demand, as well as on every push to main. A failure shows red in
# Actions and GitHub emails the repository owner; the token stays read-only (no issue is opened, 093-A1 §11.2).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  advisories:
    name: advisories and review dates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust toolchain
        run: rustup show active-toolchain && rustc --version
      # The same pinned binary and cache key as the `deny` job in ci.yml: change the version in both files together.
      - name: Restore cargo-deny
        id: deny
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-bin-${{ runner.os }}-0.20.2
      - name: Install cargo-deny (pinned)
        if: steps.deny.outputs.cache-hit != 'true'
        run: |
          # The crate download can fail for a moment; 3 attempts, 20 seconds apart.
          for attempt in 1 2 3; do
            if cargo install --locked cargo-deny --version 0.20.2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "cargo install failed after 3 attempts"
              exit 1
            fi
            echo "cargo install failed (attempt $attempt of 3); retrying in 20s"
            sleep 20
          done
      - name: Full dependency check (advisories included)
        run: |
          cargo deny --version
          cargo deny --locked check
      # Restore only: main's integration build directory makes the test below a short rebuild. Nothing is saved here.
      - name: Restore the build directory
        if: success() || failure()
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: cargo-target-${{ runner.os }}-integ-${{ hashFiles('**/Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            cargo-target-${{ runner.os }}-integ-
      - name: Exception reasons and review dates
        if: success() || failure()
        run: cargo test -p delphi --test deny_policy --locked
