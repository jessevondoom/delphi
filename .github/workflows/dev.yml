name: dev

# A build of main is published as the rolling `dev` prerelease, which `delphi update --dev` installs, ON REQUEST: a merge
# to main no longer starts one (they took 75 to 110 minutes each, on every merge, and competed with the pull request
# checks for the account's capped macOS runners). Ask for a build in one of two ways:
#   * push a tag whose name starts `dev-` on a commit that is on main:  git tag dev-$(date +%Y%m%d) <commit> && git push origin dev-$(date +%Y%m%d)
#   * Actions > dev > Run workflow, with "Use workflow from" set to main (it builds the head of main).
# A run from any other branch, or a tag on a commit that is not on main, stops at the `guard` job: the rolling release is
# never replaced by a branch build. A build older than the one already published is not published (it would move the
# channel backwards); to go back on purpose, delete the release first: gh release delete dev --cleanup-tag --yes.
# The `dev-*` tags stay in the repository after a build; delete the ones you no longer want (git push origin :dev-...).
# A nightly build may be added later; nothing here schedules one.
# Same targets, checksums and provenance attestations as a release; the version is `<crate version>-dev.g<commit>`
# so every build is distinct (the daemon and the console compare versions). The release is replaced on each build,
# so for a minute or so while it is being swapped `--dev` finds nothing. Homebrew and install.sh are not touched.
# The model, build and package steps mirror release.yml: when one changes, change the other (a build input added to
# the release and missing here fails the dev build, as the preloaded vectors did on the first run).

on:
  workflow_dispatch:
  push:
    tags: ["dev-*"]

permissions:
  contents: read

# A running build is allowed to finish (a build takes longer than the gap between requests, so cancelling it would
# starve the channel); only the newest waiting request is kept, so a build asked for while another is running and
# another is already waiting replaces the waiting one. The publish step never replaces a newer build with an older one.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  # What may be built at all. The rolling `dev` release is what `delphi update --dev` installs on other machines, so
  # it only ever carries a commit of main that someone asked for.
  guard:
    name: guard (what may be built)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A manual run must be from main
        if: github.event_name == 'workflow_dispatch'
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "run this from main (Use workflow from: main), not from $GITHUB_REF: the rolling dev release is never replaced by a branch build"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The built commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not a commit on main"; exit 1; }

  model:
    name: embedding model
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch, check and pack the embedding model
        run: dev/fetch-model.sh embed "$RUNNER_TEMP/embed.dlphmdl"
      - name: Fetch, check and pack the reranking model
        run: dev/fetch-model.sh rerank "$RUNNER_TEMP/rerank.dlphmdl"
      - name: Preloaded vectors for the shipped documents
        run: dev/build-seed-vectors.sh "$RUNNER_TEMP/embed.dlphmdl" "$RUNNER_TEMP/seed.dlphvec"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: embedmodel
          path: |
            ${{ runner.temp }}/embed.dlphmdl
            ${{ runner.temp }}/rerank.dlphmdl
            ${{ runner.temp }}/seed.dlphvec
          compression-level: 0

  # Sign the manifest of the files this build ships with the maintainers' release key (specs/036), once, for every target. With no
  # RELEASE_SIGNING_KEY secret the file is `{}` and the build is unsigned, as it always was. With one, `verify` below fails the
  # workflow unless the key's public id is in release-keys.json (a change that needs the maintainers' review) and the signature
  # holds over exactly these files and this version.
  sign:
    name: sign the release files
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stamp the version
        run: dev/stamp-version.sh "$GITHUB_SHA"
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo '{}' > release.sig.json
            echo "no release key is configured: this build is unsigned"
            exit 0
          fi
          umask 077
          keydir="$RUNNER_TEMP/release-key"
          mkdir -p "$keydir"
          chmod 700 "$keydir"
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 -d > "$keydir/release.key"
          cargo run -q --locked -p delphi-release -- sign --key "$keydir/release.key" --out release.sig.json
          rm -rf "$keydir"
          cargo run -q --locked -p delphi-release -- verify --sig release.sig.json --keys release-keys.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: releasesig
          path: release.sig.json

  build:
    name: build (${{ matrix.target }})
    needs: [model, sign]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bun: bun-linux-x64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bun: bun-linux-arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stamp the version
        id: ver
        run: |
          echo "version=$(dev/stamp-version.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: embedmodel
          path: ${{ runner.temp }}/model
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releasesig
          path: ${{ runner.temp }}/releasesig
      - name: Put the release signature in the build
        run: cp "$RUNNER_TEMP/releasesig/release.sig.json" crates/delphi/release.sig.json
      - name: Build
        env:
          DELPHI_EMBED_MODEL_FILE: ${{ runner.temp }}/model/embed.dlphmdl
          DELPHI_RERANK_MODEL_FILE: ${{ runner.temp }}/model/rerank.dlphmdl
          DELPHI_SEED_VECTORS_FILE: ${{ runner.temp }}/model/seed.dlphvec
        run: cargo build --release --locked --target ${{ matrix.target }} -p delphi --features embedded-model
      - name: Build the console
        working-directory: ui
        run: |
          # build.sh installs the target's OpenTUI native package and leaves the other platforms external.
          dev/build.sh "${{ steps.ver.outputs.version }}" dist/delphi-ui ${{ matrix.bun }}
          test -x dist/delphi-ui
      - name: Package
        run: |
          name="delphi-v${{ steps.ver.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/delphi" ui/dist/delphi-ui LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  # Both darwin targets in one job: macOS runners are capped at 5 at a time for the account, and two parallel darwin builds
  # here took 2 of those slots on every build. The two builds run one after the other (about 20 minutes in all).
  build-macos:
    name: build (darwin, both targets)
    needs: [model, sign]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stamp the version
        id: ver
        run: |
          echo "version=$(dev/stamp-version.sh "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - name: Add the targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: embedmodel
          path: ${{ runner.temp }}/model
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: releasesig
          path: ${{ runner.temp }}/releasesig
      - name: Put the release signature in the build
        run: cp "$RUNNER_TEMP/releasesig/release.sig.json" crates/delphi/release.sig.json
      - name: Build, build the console and package each target
        env:
          DELPHI_EMBED_MODEL_FILE: ${{ runner.temp }}/model/embed.dlphmdl
          DELPHI_RERANK_MODEL_FILE: ${{ runner.temp }}/model/rerank.dlphmdl
          DELPHI_SEED_VECTORS_FILE: ${{ runner.temp }}/model/seed.dlphvec
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for pair in "aarch64-apple-darwin bun-darwin-arm64" "x86_64-apple-darwin bun-darwin-x64"; do
            set -- $pair
            target="$1"
            bun="$2"
            cargo build --release --locked --target "$target" -p delphi --features embedded-model
            # build.sh installs the target's OpenTUI native package and leaves the other platforms external.
            (cd ui && rm -rf dist && dev/build.sh "$VERSION" dist/delphi-ui "$bun" && test -x dist/delphi-ui)
            name="delphi-v${VERSION}-${target}"
            mkdir -p "dist/$name"
            cp "target/${target}/release/delphi" ui/dist/delphi-ui LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
            rm -rf "dist/$name"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aarch64-apple-darwin
          path: dist/*aarch64-apple-darwin*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x86_64-apple-darwin
          path: dist/*x86_64-apple-darwin*

  publish:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: "*-*-*"
          merge-multiple: true
      - name: Attest build provenance
        # A private repository on a plan without attestations cannot make one; install.sh then checks the release signature (specs/076).
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # this job has no checkout, so gh cannot find the repository from git
        run: |
          # Never replace a newer build with an older one. The compare below asks how this commit stands against the
          # published one (`published...this`): a build someone asked for is published when it is ahead of it, the same
          # commit, or on a different line of main; it is skipped only when it is BEHIND the published one (that would
          # move the channel backwards), and the log says so. (Not "is this still the head of main" and not "is a newer
          # run waiting": the release workflow's Homebrew commit moves main without starting a run, so either rule can
          # leave the channel empty. The published commit is the first 40-hex string in the release notes.)
          have="$(gh release view dev --json body --jq .body 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -n 1 || true)"
          if [ -n "$have" ]; then
            state="$(gh api "repos/$GITHUB_REPOSITORY/compare/$have...$GITHUB_SHA" --jq .status || echo unknown)"
            case "$state" in
              ahead|identical|diverged) ;;
              behind) echo "dev is at $have, which is newer than $GITHUB_SHA; not moving the channel backwards (to go back on purpose: gh release delete dev --cleanup-tag --yes, then run this again)"; exit 0 ;;
              *) echo "could not compare the published dev build $have with $GITHUB_SHA (got: $state); not replacing it. If $have no longer exists, delete the release (gh release delete dev --cleanup-tag --yes) and run this again"; exit 1 ;;
            esac
          fi
          gh release delete dev --cleanup-tag --yes 2>/dev/null || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title "dev (main@${GITHUB_SHA::7})" \
            --notes "Dev build of main at $GITHUB_SHA, made on request ($GITHUB_EVENT_NAME), for \`delphi update --dev\`. Not a release: the next dev build replaces it."
