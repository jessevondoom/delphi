# Spec 124 S12 (AC-4): a planted diagnosis with no falsifier. D2's falsifier is a placeholder (`TBD`), which says nothing,
# and nothing else is wrong.
# Two arms, as trace-clean/case.toml says. Run on one model, 2026-11-18 (dev/train/spec124/EVIDENCE.md).
id = "trace-no-falsifier"
suite = "spec124"
kind = "task"
role = "strategist"
split = "dev"
tags = ["spec-124", "strategy-trace", "no-falsifier"]
max_cost_usd = 0.5
timeout_secs = 300
prompt = "Run the strategy_trace tool on @project/repo/strategy.md. Then report what it found: quote every finding line exactly as the tool printed it, or, if it printed none, quote its first line. Do not edit the file and do not add findings of your own."

[[check]]
kind = "outcome"
is = "done"

[[check]]
kind = "event_count"
event = "strategy.trace"
at_least = 1

[[check]]
kind = "text_matches"
pattern = 'TRACE-DIA-01 \(P2\) D2'

[[check]]
kind = "text_matches"
pattern = 'TRACE-(ACT|POL|FOR|ID|REF|DOC)-\d\d \(P2\)'
present = false

[[check]]
kind = "file_unchanged"
path = "strategy.md"
