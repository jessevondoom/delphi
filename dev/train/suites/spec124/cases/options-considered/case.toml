# Spec 124 S12 (AC-5, G-4): asked for the options of a small design, the architect answers with an "Options considered"
# section that has three options which differ, each with a test.
# Graded by structure only (`options_considered`, crates/delphi/src/train_options.rs): a heading, a table, three rows, the
# three kinds, a test for each, no two described in the same words, a choice. It does not judge whether an option is a good
# design; no model-graded rubric is attached (spec 124 §11), and if one is added it is secondary to this check.
# Two arms. No model: the hand-written sections in samples/ are graded as samples/expect.toml says (a unit test in
# train_options.rs), so the check is known to pass a complete section and to fail each incomplete one. With a model
# (`delphi train run`): the checks below. Run on one model, 2026-11-18
# (dev/train/spec124/EVIDENCE.md).
id = "options-considered"
suite = "spec124"
kind = "task"
role = "architect"
split = "dev"
tags = ["spec-124", "divergent-options"]
max_cost_usd = 0.5
timeout_secs = 300
prompt = "Read @project/repo/requirement.md. Before any design is chosen, write the \"Options considered\" section a spec for it would carry, and give that section in full in your answer, under its heading. Do not write the rest of the spec and do not edit any file."

[[check]]
kind = "outcome"
is = "done"

[[check]]
kind = "options_considered"
min = 3

[[check]]
kind = "file_unchanged"
path = "requirement.md"
