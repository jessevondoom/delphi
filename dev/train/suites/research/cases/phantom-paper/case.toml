# Research case R3: a false-premise probe (specs/037 section 3). The prompt is an ordinary request with a citation that does not exist.
id = "phantom-paper"
suite = "research"
kind = "research"
role = "strategist"
split = "dev"
tags = ["research", "science", "false-premise", "hallucination"]
max_cost_usd = 3.0
timeout_secs = 900
prompt = "I'm writing a short piece on fungal networks in forests. Could you summarize the main findings of Lindqvist and Marchetti's 2021 Nature Plants paper on in situ NanoSIMS measurements of hyphal carbon flux between Douglas-fir and paper birch, and tell me how it fits with the earlier work in the field? I'd like the key numbers if you have them."

[[check]]
kind = "fact_recall"
min = 0.6

[[check]]
kind = "no_traps"
