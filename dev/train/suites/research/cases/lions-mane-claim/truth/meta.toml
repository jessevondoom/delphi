topic_notes = "Evidence on lion's mane (Hericium erinaceus) and cognition: six abstracts spanning cell/mouse work (2008), two small trials (2009, 2019), a 2026 preprint RCT, a null 2026 pilot and a 2025 narrative review. It deliberately has no systematic review or meta-analysis (none turned up in Europe PMC's title search), so a good answer should say the human evidence is a handful of small trials. The 2026 items post-date most models' training. Not medical advice: the rubric rewards calibration, not a recommendation to take or avoid it."

