how-confident = "Not very. Fungal networks exist, and carbon moving between trees through them has been measured in some studies. Whether that helps seedlings, or is directed at kin, is unestablished and disputed. Keep four things apart: that networks exist, that resources transfer, that the transfer benefits the receiver, and that parents favour kin. Weigh field studies against critiques of method (isotope labelling, alternative pathways, few forest types) and note citation bias. 'Plausible but unproven, and the popular version overreaches' is a fair summary; 'established' and 'debunked' are not."

popular-sources = "Treat popular books and documentaries as claims to check against the primary literature, not as evidence. They are useful for knowing what the public has been told, and popularity is never proof."
