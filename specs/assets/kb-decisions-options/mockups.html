<script>
(function(){
var W=100,H=34,overflow=[];
var T=function(t,c){return {t:t,c:c||''}};
var len=function(l){var n=0;l.forEach(function(x){n+=x.t.length});return n};
var rep=function(ch,n){return n>0?new Array(Math.floor(n)+1).join(ch):''};
var pad=function(l,w){var n=w-len(l);return n>0?l.concat([T(rep(' ',n))]):l};
var cls=function(l,c){return l.map(function(x){return T(x.t,((x.c||'')+' '+c).trim())})};
var blank=function(){return [T('')]};
function mk(s){var o=[],re=/\{([^|}]*)\|([^}]*)\}/g,i=0,m;
  while((m=re.exec(s))){if(m.index>i)o.push(T(s.slice(i,m.index)));o.push(T(m[2],m[1]));i=re.lastIndex}
  if(i<s.length)o.push(T(s.slice(i)));return o}
function lr(a,b,w){a=mk(a);b=mk(b);var g=(w||W)-len(a)-len(b);return a.concat([T(rep(' ',Math.max(1,g)))],b)}
function ctr(s){var l=mk(s);return [T(rep(' ',Math.floor((W-len(l))/2)))].concat(l)}
function fit(s,n){return s.length>n?s.slice(0,n-1)+'…':s+rep(' ',n-s.length)}
function wrap(s,w){var out=[],cur='';s.split(' ').forEach(function(word){var t=cur?cur+' '+word:word;if(t.length>w){out.push(cur);cur=word}else cur=t});if(cur)out.push(cur);return out}
function hlm(t,words,base){var re=new RegExp('\\b('+words.join('|')+')\\w*','gi'),o='',i=0,m;
  while((m=re.exec(t))){if(m.index>i)o+='{'+base+'|'+t.slice(i,m.index)+'}';o+='{hl|'+m[0]+'}';i=re.lastIndex}
  if(i<t.length)o+='{'+base+'|'+t.slice(i)+'}';return o}
var RULE=[T(rep('─',W),'rule')];
var STRIP='{|⟦•_•⟧} {arch|⟦•_•⟧} {build|⟦•_•⟧} {red|⟦•_•⟧} {strat|⟦•_•⟧} {scout|⟦•••⟧}';
function card(lines){return lines.map(function(s){return [T('  ')].concat(cls(pad(mk('  '+s),W-4),'tint'))})}

function frame(o){
  var L=[mk(o.head1),mk('{dim|delphi v0.2.7 · ~/projects/app · '+o.pane+'}'),blank()];
  var foot=[mk('{dim|'+o.hint+'}'),RULE];
  if(o.prompt){foot.push(mk('{acc b|❯ }'+(o.prompt===true?'':o.prompt)));foot.push(RULE)}
  foot.push(lr('{dim|12.4k tokens}','{dim|'+o.dots+'}'));
  var room=H-L.length-foot.length,body=o.body;
  if(body.length>room)overflow.push(o.id+' body '+body.length+'>'+room);
  while(body.length<room)body.push(blank());
  return L.concat(body.slice(0,room),foot);
}

var KDOTS='shift+tab  expand  ·  ← →  ·  ○ ○ ○ ○ ● ○';
var KDOTSE='shift+tab  search  ·  ← →  ·  ○ ○ ○ ○ ● ○';

var KC={spec:'arch',lesson:'strat',code:'build',mission:'scout',skill:'dim',memory:'dim',docs:'ok',research:'warn',pdf:'dim',png:'dim'};
function boxTop(q,ph){
  var inner=60;
  return [
    mk('  {dim|╭'+rep('─',inner)+'╮}'),
    mk('  {dim|│} {acc b|›}  '+(ph?'{dim|'+fit(ph,inner-5)+'}':fit(q,inner-5))+' {dim|│}'),
    mk('  {dim|╰'+rep('─',inner)+'╯}')
  ];
}
function chips(active,items){
  var s='  {dim|show}  ';
  items.forEach(function(it,i){var on=i===active;s+='{'+(on?(it[2]?it[2]+' b':'b'):(it[2]||'dim'))+'|'+(on?'●':'○')+' '+it[0]+' '+it[1]+'}   '});
  return mk(s);
}
var CH=[['all',14,''],['research',5,'warn'],['docs',4,'ok'],['specs',3,'arch'],['lessons',1,'strat'],['missions',1,'scout']];
function krow(sel,rank,title,kind,trust,age,snip,mark,words){
  var out='',kk=kind.replace(' ↗','');
  out+=(sel?'{acc b|❯}':' ')+' {'+(sel?'acc b':'dim')+'|'+String(rank).padStart(2)+'}  {'+(sel?'b':'')+'|'+fit(title,56)+'}  {'+KC[kk]+'|'+fit(kind,8)+'}  {'+(trust==='untrusted'?'warn':'dim')+'|'+fit(trust,9)+'} {dim|'+age.padStart(6)+'}';
  if(mark)out+='  {acc b|'+mark+'}';
  return [mk('  '+out),mk('       '+hlm(fit(snip,86).replace(/\s+$/,''),words||KW,'dim')),blank()];
}
function listHead(){return mk('  {dim|   #  title                                                    kind      trust       edited}')}
var KW=['byzantine','fault','quorum','vote','tolerat'];
function rows(sel,marks){
  var R=[
    ['knowledge/web/arxiv.org/castro-liskov-pbft.md › Abstract','research','listed','2 d','a state machine replication algorithm that tolerates Byzantine faults and works in asynchronous …'],
    ['context/lessons/council-deadlock.md › Model-family tiebreakers','lesson','trusted','5 d','two seats of one model family are one vote: they tend to share the same fault …'],
    ['docs/reference/council.md › Quorum and votes','docs','trusted','1 w','a quorum needs three agreeing votes; two seats of one model family count as one vote'],
    ['specs/003-collaboration-and-council.md › 4 Quorum','spec','trusted','2 w','the council decides by quorum; a seat that cannot be reached counts as a fault, not a vote']
  ],out=[];
  R.forEach(function(r,i){out=out.concat(krow(sel===i,i+2,r[0],r[1],r[2],r[3],r[4],marks&&marks[i]))});
  return out;
}
var SCREENS={};
function cardHead(l,r){return [T('  ')].concat(cls(pad([T('  ')].concat(lr(l,r,92)),96),'tint'))}

function ditem(d,sel,ticked){

  var o=[lr('{'+(sel?'acc b':'dim')+'|'+(sel?'❯':' ')+'} '+box+' {dim|'+d.id+'}  {'+(c?c+' b':'b')+'|'+d.title+'}','{'+(c||'dim')+'|'+d.tag+'}  {dim|'+d.age+'}  ',W)];
  wrap(d.sum,90).forEach(function(l){o.push(mk('        {|'+l+'}'))});
  o.push(mk('        '+d.rec));o.push(blank());
  return o;
}
function dlist(items,sel,ticks){var b=[];items.forEach(function(d,i){b=b.concat(ditem(d,i===sel,ticks&&ticks[d.id]))});return b}
