<script>
(function(){
var W=100,H=34,overflow=[];
var T=function(t,c){return {t:t,c:c||''}};
var len=function(l){var n=0;l.forEach(function(x){n+=x.t.length});return n};
var rep=function(ch,n){return n>0?new Array(Math.floor(n)+1).join(ch):''};
var pad=function(l,w){var n=w-len(l);return n>0?l.concat([T(rep(' ',n))]):l};
var cls=function(l,c){return l.map(function(x){return T(x.t,((x.c||'')+' '+c).trim())})};
var blank=function(){return [T('')]};
function mk(s){var o=[],re=/\{([^|}]*)\|([^}]*)\}/g,i=0,m;
  while((m=re.exec(s))){if(m.index>i)o.push(T(s.slice(i,m.index)));o.push(T(m[2],m[1]));i=re.lastIndex}
  if(i<s.length)o.push(T(s.slice(i)));return o}
function lr(a,b,w){a=mk(a);b=mk(b);var g=(w||W)-len(a)-len(b);return a.concat([T(rep(' ',Math.max(1,g)))],b)}
function ctr(s){var l=mk(s);return [T(rep(' ',Math.floor((W-len(l))/2)))].concat(l)}
function fit(s,n){return s.length>n?s.slice(0,n-1)+'…':s+rep(' ',n-s.length)}
function wrap(s,w){var out=[],cur='';s.split(' ').forEach(function(word){var t=cur?cur+' '+word:word;if(t.length>w){out.push(cur);cur=word}else cur=t});if(cur)out.push(cur);return out}
function hlm(t,words,base){var re=new RegExp('\\b('+words.join('|')+')\\w*','gi'),o='',i=0,m;
  while((m=re.exec(t))){if(m.index>i)o+='{'+base+'|'+t.slice(i,m.index)+'}';o+='{hl|'+m[0]+'}';i=re.lastIndex}
  if(i<t.length)o+='{'+base+'|'+t.slice(i)+'}';return o}
var RULE=[T(rep('─',W),'rule')];
var STRIP='{|⟦•_•⟧} {arch|⟦•_•⟧} {build|⟦•_•⟧} {red|⟦•_•⟧} {strat|⟦•_•⟧} {scout|⟦•••⟧}';
function card(lines){return lines.map(function(s){return [T('  ')].concat(cls(pad(mk('  '+s),W-4),'tint'))})}

function frame(o){
  var L=[mk(o.head1),mk('{dim|delphi v0.2.7 · ~/projects/app · '+o.pane+'}'),blank()];
  var foot=[mk('{dim|'+o.hint+'}'),RULE];
  if(o.prompt){foot.push(mk('{acc b|❯ }'+(o.prompt===true?'':o.prompt)));foot.push(RULE)}
  foot.push(lr('{dim|12.4k tokens}','{dim|'+o.dots+'}'));
  var room=H-L.length-foot.length,body=o.body;
  if(body.length>room)overflow.push(o.id+' body '+body.length+'>'+room);
  while(body.length<room)body.push(blank());
  return L.concat(body.slice(0,room),foot);
}

/* ============================ KNOWLEDGE BASE ============================ */
var KDOTS='← →  ·  ○ ○ ○ ○ ● ○';
var KHEAD=STRIP;
var MODE='{acc|●} offline   {dim|○ online   ○ both}';
function boxTop(q,mode){
  var inner=60;
  return [
    mk('  {dim|╭'+rep('─',inner)+'╮}'),
    lr('  {dim|│} {acc b|›}  '+fit(q,inner-5)+' {dim|│}',mode+'  ',W),
    mk('  {dim|╰'+rep('─',inner)+'╯}')
  ];
}
var KC={spec:'arch',lesson:'strat',code:'build',mission:'scout',memory:'dim',pdf:'amb',png:'amb',skill:'warn'};
function chips(active,items){
  var s='  {dim|show}  ';
  items.forEach(function(it,i){var on=i===active;s+='{'+(on?it[2]+' b':it[2])+'|'+(on?'●':'○')+' '+it[0]+' '+it[1]+'}   '});
  return lr(s,'{dim|tab to change}  ');
}
var CH=[['all',14,''],['specs',5,'arch'],['lessons',3,'strat'],['code',4,'build'],['missions',2,'scout']];
function krow(sel,rank,title,kind,trust,age,snip,mark,words){
  var out='';
  out+=(sel?'{acc b|❯}':' ')+' {'+(sel?'acc b':'dim')+'|'+String(rank).padStart(2)+'}  {'+(sel?'b':'')+'|'+fit(title,56)+'}  {'+KC[kind.replace(' ↗','')]+'|'+fit(kind,8)+'}  {'+(trust==='untrusted'?'warn':'dim')+'|'+fit(trust,9)+'} {dim|'+age.padStart(6)+'}';
  if(mark)out+='  {acc b|'+mark+'}';
  return [mk('  '+out),mk('       '+hlm(fit(snip,86).replace(/\s+$/,''),words||['council','deadlock','escalat'],'dim')),blank()];
}
function listHead(){return mk('  {dim|   #  title                                                    kind      trust       edited}')}
var KW=['council','deadlock','escalat'];
function rows(sel,marks,start){
  var R=[
    ['context/lessons/council-deadlock.md › Model-family tiebreakers','lesson','trusted','5 d','a deadlock between two seats of one model family is not a deadlock: it is one vote …'],
    ['crates/delphi-engine/src/handoff.rs › escalate_deadlock','code','trusted','1 d','pub fn escalate_deadlock(session, card): creates the operator card, emits CouncilDeadlockEscalated'],
    ['specs/011-xenia-signatures.md › 3 Deadlock seal format','spec','trusted','2 w','deadlock records are sealed with a detached signature before the operator sees them'],
    ['missions/2026-10-23-foundational-design/spec-tracker.md › 005e','mission','trusted','4 d','005e approved; the deadlock escalation card is wired to the operator deck'],
    ['memory/agents/red-team/notes.md › council','memory','untrusted','3 w','seats of one family often agree on the same wrong answer; ask a second family']
  ],out=[];
  R.forEach(function(r,i){out=out.concat(krow(sel===i,i+2,r[0],r[1],r[2],r[3],r[4],marks&&marks[i]))});
  return out;
}
var SCREENS={};

SCREENS['kb-1-resting']=function(){
  var b=[];for(var i=0;i<6;i++)b.push(blank());
  b.push(ctr('{b|knowledge}'));b.push(blank());
  b.push(ctr('{dim|╭'+rep('─',47)+'╮}'));
  b.push(ctr('{dim|│} {acc b|›}  {dim|search what Delphi knows…}'+rep(' ',19)+'{dim|│}'));
  b.push(ctr('{dim|╰'+rep('─',47)+'╯}'));
  b.push(blank());
  b.push(ctr(MODE));
  b.push(blank());b.push(blank());b.push(blank());
  b.push(ctr('{arch|specs 31}    {strat|lessons 42}    {build|code 118}    {scout|missions 19}    {warn|skills 48}    {dim|memory 64}'));
  b.push(blank());
  b.push(ctr('{dim|1,204 documents · 8,931 passages · updated 2 min ago}'));
  return frame({id:'kb-1',head1:KHEAD,pane:'knowledge',body:b,hint:'type to search · tab offline / online / both · ↑ earlier searches · ctrl+t trusted only',dots:KDOTS});
};

SCREENS['kb-2-results']=function(){
  var b=boxTop('how does the council escalate a deadlock',MODE);
  b.push(lr('  {dim|14 results · 0.04 s · 0 tokens}','{acc b|s}  summarize for me {dim|· uses the model, about 1.2k tokens}  '));
  b.push(chips(0,CH));b.push(blank());
  var c=[
    lr('{dim b|BEST MATCH}','{arch|spec} {dim|· trusted · edited 3 d ago}',W-6),
    '{acc b|specs/005e-console-redesign.md › 9.2 The council view}'
  ];
  wrap('When two rounds end without agreement, the council escalates. The seats keep their stances and the decision goes to the operator as a card. The card pauses autonomous work on the blocking worktree until you resolve it.',88).forEach(function(l){c.push(hlm(l,KW,''))});
  c.push('');c.push('{dim|lines 184–210 · cited again by results 2, 4 and 5}');
  c.push('{acc b|enter} read   {acc b|o} open file   {acc b|m} more like this');
  var cc=card(c.map(function(x){return typeof x==='string'?x:'';}));
  /* header row of the card is a segment list: rebuild it */
  cc[0]=[T('  ')].concat(cls(pad([T('  ')].concat(lr('{dim b|BEST MATCH}','{arch|spec} {dim|· trusted · edited 3 d ago}',92)),96),'tint'));
  b=b.concat(cc);b.push(blank());
  b.push(listHead());
  b=b.concat(rows(0,null).slice(0,11));
  b.push(mk('  {dim|   + 8 more below}'));
  return frame({id:'kb-2',head1:KHEAD,pane:'knowledge',body:b,hint:'↑ ↓ pick · enter open · s summarize · m more like this · tab filter · / edit the search · esc clear',dots:KDOTS});
};

SCREENS['kb-3-summary']=function(){
  var b=boxTop('how does the council escalate a deadlock',MODE);
  b.push(lr('  {dim|14 results · 0.04 s}','{ok|✔} summarized · 1,180 tokens spent  '));
  b.push(chips(0,CH));b.push(blank());
  var hd=[T('  ')].concat(cls(pad([T('  ')].concat(lr('{b|SUMMARY}  {warn|written by the model, not checked}','{dim|from results 1–5}',92)),96),'tint'));
  var c=[];
  wrap('A deadlock is two rounds of council debate that end without agreement. The council stops there and sends the decision to you as a card [1], and the blocked worktree waits while other work continues [1]. Two seats from the same model family count as one vote, so a second family is asked before you see the card [2]. The card is sealed with a detached signature [3][4].',88).forEach(function(l){c.push(l)});
  c.push('');
  c.push('{dim|sources}  {acc|[1]} 005e §9.2   {acc|[2]} council-deadlock.md   {acc|[3]} handoff.rs   {acc|[4]} 011 §3');
  c.push('{acc b|c} copy summary   {acc b|esc} back to the best match');

  b.push(hd);b=b.concat(cc);b.push(blank());
  b.push(listHead());
  var first=[mk('    '+'{dim| 1}'+'  '+fit('specs/005e-console-redesign.md › 9.2 The council view',56)+'  {arch|spec    }  {dim|trusted }  {dim|  3 d}  {acc b|◂ [1]}'),blank()];
  b=b.concat(first);
  b=b.concat(rows(-1,[ '◂ [2]','◂ [3]','◂ [4]',null,null]).slice(0,9));
  return frame({id:'kb-3',head1:KHEAD,pane:'knowledge',body:b,hint:'↑ ↓ pick a source · enter open it · c copy summary · esc back to the best match',dots:KDOTS});
};

  b.push(mk('   {acc|[3]} AGENTS.md › Do not widen authority'));
  b.push(blank());b.push(lr('  {dim|─── end of section 9.2 ───}','{dim|lines 184–226 of 412  ·  48%}  '));
  return frame({id:'kb-4',head1:KHEAD,pane:'knowledge › reading',body:b,hint:'tab next link · enter follow · [ ] back / forward · ↑ ↓ scroll · y copy path · esc back to results',dots:KDOTS});
};

SCREENS['kb-5-pdf']=function(){

  var c=[
    '{acc b|docs/diagrams/council-flow.pdf}','',

/* ============================== DECISIONS ============================== */
var DDOTS='← / ? → · ○ ○ ●';
var DH='{red b|⟦x?x⟧ red-team: 5 decisions needed · 09:14 remaining}';
var DEC=[
 {id:'DEC-081',tier:'red',tag:'RED · action',title:'Run a migration on the host staging.db, outside the sandbox',age:'18 m',
  sum:'builder wants to run scripts/migrate_0.2.7.sql on /var/data/staging.db. It rewrites about 420 KB of host data that git cannot roll back, and it leaves the sandbox.',
  rec:'{dim|no recommendation: your call. Red actions are decided one at a time.}',box:false},
 {id:'DEC-083',tier:'red',tag:'RED · spec',title:'Approve spec 042: chunked bundle streaming over IPC',age:'12 m',
  sum:'Streams bundle manifests over IPC in 64 KB chunks with backpressure, so large repositories stop spiking memory. Approving it lets builder start t_016.',

 {id:'DEC-082',tier:'amb',tag:'AMBER · build',title:'Raise the rate-limit burst from 20 to 50 per second',age:'9 m',

 {id:'DEC-085',tier:'amb',tag:'AMBER · build',title:'Reuse stored vectors when a document is unchanged',age:'6 m',

  rec:'{ok|✔ recommend Brave Search} {dim|· the client is provider-neutral, so switching later is cheap}',box:true}
];
var TC={red:'red',amb:'amb',q:''};
var DCH=[['all',5,''],['actions',1,'red'],['specs',1,'red'],['builds',2,'amb'],['questions',1,'']];
function dchips(active){
  var s='  {dim|show}  ';
  DCH.forEach(function(it,i){var on=i===active;s+='{'+(on?(it[2]?it[2]+' b':'b'):(it[2]||'dim'))+'|'+(on?'●':'○')+' '+it[0]+' '+it[1]+'}   '});
  return lr(s,'{dim|summaries cached · 0 tokens   f change}  ');
}
function ditem(d,sel,ticked){
  var c=TC[d.tier],box=d.box?(ticked?'{ok b|[x]}':'{dim|[ ]}'):'   ';
  var o=[lr('{'+(sel?'acc b':'dim')+'|'+(sel?'❯':' ')+'} '+box+' {dim|'+d.id+'}  {'+(c?c+' b':'b')+'|'+d.title+'}','{'+(c||'dim')+'|'+d.tag+'}  {dim|'+d.age+'}  ',W)];
  wrap(d.sum,90).forEach(function(l){o.push(mk('        {|'+l+'}'))});
  o.push(mk('        '+d.rec));o.push(blank());
  return o;
}
function dlist(items,sel,ticks){var b=[];items.forEach(function(d,i){b=b.concat(ditem(d,i===sel,ticks&&ticks[d.id]))});return b}

function detailHead(d,pos){
  var c=TC[d.tier];
  return [
