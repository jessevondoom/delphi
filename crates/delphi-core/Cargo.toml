[package]
name = "delphi-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Delphi daemon core: events, redaction and the durable segmented log (roadmap Step 2)"
license = "UNLICENSED"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
base64 = "0.22"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.8"
