<title id="chart-title">Builds are slowest on Windows</title>
<desc id="chart-desc">Bar chart. linux: minimum 3.7 at Q3, maximum 4.2 at Q1. macos: minimum 5.2 at Q3, maximum 6.1 at Q1. windows: minimum 8.4 at Q3, maximum 9.8 at Q1. Values: Q1 4.2 / 6.1 / 9.8; Q2 4.0 / 5.8 / 9.1; Q3 3.7 / 5.2 / 8.4.</desc>
