<title id="chart-title">Four services converge after the cache change</title>
<desc id="chart-desc">Line chart. api: minimum 76% at 6, maximum 90% at 1. From 90% to 76% it falls 16%. web: minimum 70% at 1, maximum 76% at 5. From 70% to 76% it rises 9%. worker: minimum 50% at 1, maximum 75% at 6. From 50% to 75% it rises 50%. batch: minimum 30% at 1, maximum 75% at 6. From 30% to 75% it rises 150%. Values: 1 90% / 70% / 50% / 30%; 2 88% / 72% / 55% / 36%; 3 85% / 74% / 62% / 45%; 4 80% / 75% / 68% / 60%; 5 77% / 76% / 73% / 72%; 6 76% / 76% / 75% / 75%.</desc>
