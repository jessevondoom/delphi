[package]
name = "delphi-docs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Dependency-free document readers and writers for Delphi agents (specs/014)"
license = "MIT"
publish = false

[dependencies]
# Both are already in the workspace's dependency tree (specs/014 §1.1): inflate for zip members, gzip and
# PDF streams; CRC-32 to catch a corrupt zip member.
flate2 = "1"
crc32fast = "1.5"
# Parsers the workspace already uses, for the JSON, YAML and TOML outline view.
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "1.1"

[features]
# Test-only: archive builders for other crates' tests. The real writers arrive with slice C0.
test-support = []

[dev-dependencies]
