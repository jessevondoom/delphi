[package]
name = "delphi-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Delphi adapter: model access, credentials, the Claude pass and platform envelopes (roadmap Step 2)"
license = "UNLICENSED"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
base64 = "0.22"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
futures-util = "0.3.34"
hmac = "0.13.0"
sha2 = "0.11.0"
crc32fast = "1.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
regex = "1.13.1"

[dev-dependencies]
tempfile = "3.8"
