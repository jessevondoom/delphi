[package]
name = "delphi-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OS-level sandbox for Delphi: sandbox-exec (macOS) and bubblewrap (Linux), deny-by-default (roadmap Step 3)"
license = "UNLICENSED"
publish = false

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.8"
