# Every place non-test Rust starts a process, by file and class (spec 093 K1).
#
# `spawn_sites.rs` scans `crates/` and fails when a file starts more processes than listed here, when an unlisted
# file starts one, or when a listed file starts fewer (a stale entry). Add or change an entry in the same pull request
# as the code, and choose the class that is true. A site that fits no class is a design question for the reviewer,
# not a reason to add a class.
#
# What counts as a site: `Command::new(`, `Command::from(`, `CommandBuilder::new(`, `openpty(`, `native_pty_system(`
# and `forkpty(` in code that is not test code. Test code is a `#[cfg(test)] mod` (to the end of the file) or a
# `#[cfg(test)]` item, and `tests/`, `tests.rs` and `*_tests.rs`. Comment lines are ignored.
#
# Classes:
#   sandbox          the OS-sandbox launcher; the only place that may run arguments an agent chose
#   seat             starts a model-driven harness CLI seat, built by the sandbox's `plain_command`
#   self             runs this program's own executable (daemon, bundle, update, capabilities refresh, training runs)
#   git              git, gh or tar with arguments Delphi builds; no agent-chosen words
#   probe            runs a CLI with a fixed flag to read its version, help or quota; no model input
#   opener           hands a URL to the system opener, or a secret to the OS keychain helper
#   operator-config  argv comes from ratified operator configuration, run with a cleared environment (GOVERNANCE 5.11)
#   operator-cli     runs only after an explicit operator command in a terminal
#   train            the training harness (a source checkout; spends the operator's tokens on purpose)
#   test-support     a helper module used only by tests

