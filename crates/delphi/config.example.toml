# ─────────────────────────────────────────────────────────────────────────────
# DELPHI WORKSPACE CONFIGURATION TEMPLATE (crates/delphi/config.example.toml)
# Seeded by `delphi init` into $DELPHI_HOME/workspaces/<name>/config.toml (never into a project repo).
# API keys are NEVER stored here: they live in macOS Keychain / Linux Secret Service,
# with the *_env variables below as fallback (specs/006 §2.2).
# ─────────────────────────────────────────────────────────────────────────────

[workspace]
name = "delphi"
projects = ["~/code/my-project"]         # project repos this workspace operates on (D-03)
untrusted_paths = ["vendor/**", "third_party/**", "node_modules/**"]  # tracked files here read as external_untrusted
isolated = false                     # true: nothing is ever promoted out of this workspace (specs/004 §5.4)

[privacy]
identifiers = []                     # repo names, hosts and terms that must never appear in operator-scope rules
default_mode = "orchestrator" # orchestrator | council

[theme]
name = "greek"                 # display names, window labels and persona voice only (specs/001 §6); behavior never depends on it

[tui]
auto_spawn_narrator = false   # Set true for automatic dual-window on launch
frame_rate_hz = 60

# Model tiers per family, and per-model limits and prices (specs/002 §4). The access path and
# credentials for each family are [[endpoints]] (specs/009, below). Fill in current model IDs and prices.
[models.claude]
fast = "<claude fast model id>"
workhorse = "<claude workhorse model id>"
frontier = "<claude frontier model id>"

[models.gemini]
fast = "<gemini fast model id>"
workhorse = "<gemini workhorse model id>"
frontier = "<gemini frontier model id>"

# [models.catalog."<model id>"]
# max_output_tokens = 64000
# min_thinking_budget = 1024
# max_thinking_budget = 32000
# context_tokens = 200000            # the context window; omit if unknown (routing never treats unknown as too small)
# thinking_in_max_tokens = true      # Claude: true; Gemini: false
# input_usd_per_mtok = 0.0
# cache_read_usd_per_mtok = 0.0
# cache_write_usd_per_mtok = 0.0
# output_usd_per_mtok = 0.0          # thinking is billed at the output rate

[agents]
enabled = ["orchestrator", "architect", "builder", "red-team", "strategist"]   # D-07 v1 roster

[events]
thinking_retention_days = 30         # D-16

[routing]
enable_dynamic_scaling = true
cross_provider_builder_critic = true # [H-007] Pair Claude builder with Gemini critic
max_attempts_per_node = 3            # Unified retry ladder (specs/003 §3.2): upscale, then reset, then escalate
max_parallel_agents = 4
# When no usable model is left, a task waits for one to return (and says so) instead of failing, and a
# weaker substitute is used only after you confirm it for that task (declining, or not answering, means waiting).
# degrade_prompt_secs = 300           # how long the "run on a weaker model?" card waits; no answer means look again, then ask again
# max_park_secs = 0                  # omit to wait as long as it takes; 0 = never wait (escalate at once); N = give up after N seconds

# Model pool (specs/002 §4.1, D-26: ratified). Models in preference order; when the first eligible
# model is exhausted (quota, subscription window or budget) the next one takes over and work continues.
# Roles ask for capabilities, never for a named model. Omit to use every configured tier, family by family.
# Each model expands to every allowed endpoint that serves it, and its state is kept per endpoint and
# model. `delphi models` shows where each stands; `delphi models --probe` re-checks them.
# [routing.pool]
# order = ["<claude frontier model id>", "<gemini frontier model id>", "<claude workhorse model id>"]
# throttle_attempts = 3                # this many throttles in a row ...
# throttle_window_secs = 600           # ... over at least this long count as a spent quota
# reprobe_first_secs = 900             # an exhausted model with no known reset time is probed after this ...
# reprobe_max_secs = 14400             # ... then at doubling intervals up to this
# [routing.targets]                    # optional target model per role; a similar model is substituted if it is
# red-team = "<model id>"              # unavailable, and a weaker one needs the operator's confirmation

[budget]
mission_budget_usd = 5.0             # D-10: L1–L3 work (enforced with pre-dispatch cost reservations)
council_budget_usd = 20.0            # D-10: Council Mode
on_budget_exhausted = "escalate"     # halt node and ask the operator; never silently downscale
per_watch_max_wakes_per_day = 10

# What the engine adds around a role's model calls (specs/045). Not an access table: it adds notes and one verification turn,
# never a tool or a permission. Every key shown is the default.
# [loop]
# nudge = true                       # tell a role that is going round in circles; end the span if it carries on
# nudge_edits = 4                    # writes to one file before the nudge (twice this ends the span)
# budget_warnings = true             # tell a role when 75 % and 90 % of its turns are used
# verify_gate = true                 # one check against the task before a role that writes or runs commands may finish
# workspace_bootstrap = true         # give a role with a worktree a map of it

[hitl]
approval_timeout_sec = 600           # Unanswered approvals resolve to DENY

# Commands (D-24): the OS sandbox is optional. "off" (default): every command asks for approval unless an allow rule
# covers it; "prefer": use the sandbox when there is one (sandboxed commands need no approval); "required".
# This table is ratified: widening it is a Red-tier proposal. `delphi setup` fills in test_command for your project.
[exec]
sandbox = "off"
# allow = ["cargo test*"]            # commands that need no approval (patterns over the argv; `*` matches anything)
# deny = ["git push*"]               # commands that are refused outright
# test_command = ["cargo", "test"]   # merge gate 1
# check_command = ["cargo", "clippy"] # merge gate 2

# Releases (specs/036). Uncomment to make `delphi update` refuse any build that is not a signed release. This table is ratified:
# adding the line takes effect at once, and taking it out takes effect when you ratify the removal. Development builds and source
# builds are unsigned, so this is for installs that follow releases.
# [update]
# require_signed = true

# Fact validator (specs/040 section 15.1). off: no fetch of any kind. advisory (default): the full fact path as a dry run; it uses the
# network, records what it would ratify and writes nothing validated. ratify: real writes, allowed only while the daemon's latch and the
# PROMOTE conditions permit; the effective mode is the lower of this value and the latch.
# [validator]
# mode = "advisory"
# [validator.sources]          # your additions to the default source list (registrable domains)
# primary = []
# reputable = []
# weak = []

# Research (specs/028 section 10): the web search engines the archives pane's expand mode asks, in order, one at a time (the next only if
# the last failed). Ratified, because it names who receives your queries. Which sites may be read is context/sources/trusted.toml plus your
# own $DELPHI_HOME/operator/trusted-sources.toml. Unset: research cannot run.
# [search]
# providers = ["brave", "mojeek", "searxng"]   # brave | mojeek | searxng | kagi | google (google only with a Gemini endpoint)
# [search.brave]
# credential = "env:BRAVE_API_KEY"
# [search.mojeek]
# credential = "env:MOJEEK_API_KEY"
# [search.searxng]
# url = "https://searx.example.org"

[rag]
engine = "sqlite-hybrid"             # informational: FTS5 + sqlite-vec + RRF + reranker (spec 004). What runs depends on the models installed;
                                     # DELPHI_EMBED_MODEL=off / DELPHI_RERANK_MODEL=off / DELPHI_SEED_VECTORS=off switch each part off
max_pointer_results = 10
exclude_untrusted_by_default = true

[federation]
enabled = false
transport = "tailscale"              # tailscale | ssh-uds | mdns
default_peer_trust_ceiling = "federated_peer"

# ── Model access (specs/009). [[endpoints]], [access] and [auth.*] are ratified: changes are Red-tier proposals.
# [[endpoints]]
# id = "bedrock-us"
# family = "claude"
# path = "cloud"              # api | cloud | gateway-native | gateway-compat | harness
# platform = "bedrock"
# region = "us-east-1"
# credential = "aws:work-sso"
#
# A slow local fallback for when paid quota runs out (Ollama; free, nothing leaves the machine). Declare it AFTER the paid
# endpoints: the pool reaches families in declaration order. `credential = "none"` is accepted only for a loopback base_url.
# [[endpoints]]
# id = "ollama"
# family = "local"
# path = "gateway-compat"
# base_url = "http://localhost:11434"
# credential = "none"
# cost_model = "local"
# models = { fast = "qwen3:8b", workhorse = "qwen3:8b", frontier = "qwen3:8b" }
# [models.catalog."qwen3:8b"]
# max_output_tokens = 8192
#
# [access]
# order = { claude = ["bedrock-us"] }
# allowed_endpoints = ["bedrock-us"]
#
# [auth.corp-okta]
# flow = "device_code"
# issuer = "https://idp.example.com"
# client_id = "<from your IdP admin>"
# scopes = ["llm.invoke"]

# ── Subscription CLIs (specs/020). Nothing here is needed: with no [harness.claude] block, the values shown below ARE the
# defaults. Delphi's tools (timer, dispatch, scoped files, connectors) reach the Claude CLI over a per-span MCP bridge; for roles
# that do not edit files the CLI runs in its auto permission mode, so your organization's policy and the CLI's own classifier
# answer first and Delphi asks you only about what they cannot settle; the web tools and the account's own connectors are on.
# A block exists only to NARROW this, and like [access] it is ratified (Red tier). Builders always stay on Delphi's rules.
# `delphi doctor` and `delphi endpoints test --probe` show whether your organization's MCP policy lets the bridge load.
# The same block's keys apply to the Antigravity CLI as [harness.agy] where they can: `bridge` (a plugin carrying Delphi's tools
# and a hook that denies its other tools, in the span's own working directory), `native_tools` (the web tools the hook lets
# through: "WebSearch" and "WebFetch" become search_web and read_url_content) and `env_allow`. Its spans start untrusted (L0)
# and are never a Builder until `delphi endpoints test --probe` has watched the hook deny every kind of tool on the installed agy
# version; then they start trusted (falling to L0 when they read the web) and a Builder's file edits go through the hook and
# Delphi's approval cards, its commands through Delphi's own run_command tool.
# The Codex CLI is [harness.codex] (`harness = "codex"`, `family = "openai"` on the endpoint; specs/047 S1). A seat is read-only and
# untrusted (L0): `codex exec` in a read-only sandbox, nothing saved, your own ~/.codex config ignored, no Delphi tools, and never a
# Builder. Keys: `effort` ("low", "medium" or "high"), `json_schema`, `env_allow`. A key source as the endpoint's credential
# (`keychain:`, `env:`) runs it on CODEX_API_KEY; `harness-login` uses your ChatGPT sign-in.
# The GitHub Copilot CLI is [harness.copilot] (`harness = "copilot"` on the endpoint; specs/051 S1). One login serves several
# vendors' models, so name the model in `models` and set the endpoint's `family` to that model's vendor (`claude`, `gemini` or
# `openai`); an answer from a different model is refused, and `auto` is never used. A seat is read-only and untrusted (L0): no
# Delphi tools, no write or shell (the CLI denies them without an approver), a home inside the task's own scratch directory (so its saved
# session never lands in your ~/.copilot), and never a Builder. Keys: `effort`, `env_allow`, `quota_source`. A key source as the credential (`keychain:`, `env:`) runs it on COPILOT_GITHUB_TOKEN (a
# fine-grained token with "Copilot Requests"); `harness-login` uses the login `copilot login` stored in your keychain.
# `quota_source = "gh"` lets `delphi doctor` show the account's plan and pool through your `gh` login (an undocumented endpoint); off by default.
# [harness.claude]
# bridge = true                        # false: roles without a worktree run text-only (no timer, dispatch or file tools)
# approvals = "delegate"               # "delphi": Delphi's own tiers and cards answer every request instead
# native_tools = ["WebSearch", "WebFetch"]   # the CLI's own tools for roles without a worktree (what they fetch is untrusted); [] for none
# claudeai_connectors = true           # false: only Delphi's bridge is loaded (the account's connectors and your own MCP servers stay out)
# connector_reads = []                 # with approvals = "delphi": exact names like "mcp__claude_ai_Slack__slack_search" that only read; any other connector tool is a Red card
# env_allow = []                       # extra environment variable NAMES passed to the CLI (for example "AWS_PROFILE"); never values
# [harness]
# connector_settle_secs = 10           # how long a span waits for the account's connectors to finish loading before its first turn

# ── Connectors (specs/010). [connectors.*] is ratified like [access]. Delphi ships no client IDs: create an OAuth
# client in your own Google Cloud project, then `delphi auth login google`, `delphi connectors test drive`,
# `delphi connectors pin drive`, and /ratify the pins. The server URLs below are reported, not confirmed: check them
# with `delphi connectors test` before relying on them.
# [auth.google]
# flow = "loopback_pkce"
# issuer = "https://accounts.google.com"
# client_id = "<from your Google Cloud project>"
# client_secret = "keychain:google-client-secret"
# scopes = ["openid", "email", "https://www.googleapis.com/auth/drive.readonly"]
# authorization_params = { access_type = "offline", prompt = "consent" }
#
# [connectors.drive]
# url = "https://drivemcp.googleapis.com/mcp"
# hosts = ["drivemcp.googleapis.com", "openidconnect.googleapis.com"]
# login = "google"
# account = "you@example.com"          # the login must resolve to this address, or it is discarded
# identity = "google"
# roles = ["orchestrator", "strategist"]
# tools = { search_files = "read", read_file = "read", list_folder = "read" }   # your allowlist and classification
# max_arg_chars = 128
# first_use = "ask"                    # "ask" or "allow" (Green for reads)
