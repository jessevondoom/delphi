# ─────────────────────────────────────────────────────────────────────────────
# DELPHI WORKSPACE CONFIGURATION TEMPLATE (crates/delphi/config.example.toml)
# Seeded by `delphi init` into $DELPHI_HOME/workspaces/<name>/config.toml (never into a project repo).
# API keys are NEVER stored here: they live in macOS Keychain / Linux Secret Service,
# with the *_env variables below as fallback (specs/006 §2.2).
# ─────────────────────────────────────────────────────────────────────────────

[workspace]
name = "delphi"
projects = ["~/code/my-project"]         # project repos this workspace operates on (D-03)
untrusted_paths = ["vendor/**", "third_party/**", "node_modules/**"]  # tracked files here read as external_untrusted
isolated = false                     # true: nothing is ever promoted out of this workspace (specs/004 §5.4)

[privacy]
identifiers = []                     # repo names, hosts and terms that must never appear in operator-scope rules
default_mode = "orchestrator" # orchestrator | council

[theme]
name = "greek"                 # display names, window labels and persona voice only (specs/001 §6); behavior never depends on it

[tui]
auto_spawn_narrator = false   # Set true for automatic dual-window on launch
frame_rate_hz = 60

# Model tiers per family, and per-model limits and prices (specs/002 §4). The access path and
# credentials for each family are [[endpoints]] (specs/009, below). Fill in current model IDs and prices.
[models.claude]
fast = "<claude fast model id>"
workhorse = "<claude workhorse model id>"
frontier = "<claude frontier model id>"

[models.gemini]
fast = "<gemini fast model id>"
workhorse = "<gemini workhorse model id>"
frontier = "<gemini frontier model id>"

# [models.catalog."<model id>"]
# max_output_tokens = 64000
# min_thinking_budget = 1024
# max_thinking_budget = 32000
# thinking_in_max_tokens = true      # Claude: true; Gemini: false
# input_usd_per_mtok = 0.0
# cache_read_usd_per_mtok = 0.0
# cache_write_usd_per_mtok = 0.0
# output_usd_per_mtok = 0.0          # thinking is billed at the output rate

[agents]
enabled = ["orchestrator", "architect", "builder", "red-team", "strategist"]   # D-07 v1 roster

[events]
thinking_retention_days = 30         # D-16

[routing]
enable_dynamic_scaling = true
cross_provider_builder_critic = true # [H-007] Pair Claude builder with Gemini critic
max_attempts_per_node = 3            # Unified retry ladder (specs/003 §3.2): upscale, then reset, then escalate
max_parallel_agents = 4

# Model pool (specs/002 §4.1, D-26: ratified). Models in preference order; when the first eligible
# model is exhausted (quota, subscription window or budget) the next one takes over and work continues.
# Roles ask for capabilities, never for a named model. Omit to use every configured tier, family by family.
# Each model expands to every allowed endpoint that serves it, and its state is kept per endpoint and
# model. `delphi models` shows where each stands; `delphi models --probe` re-checks them.
# [routing.pool]
# order = ["<claude frontier model id>", "<gemini frontier model id>", "<claude workhorse model id>"]
# throttle_attempts = 3                # this many throttles in a row ...
# throttle_window_secs = 600           # ... over at least this long count as a spent quota
# reprobe_first_secs = 900             # an exhausted model with no known reset time is probed after this ...
# reprobe_max_secs = 14400             # ... then at doubling intervals up to this
# [routing.targets]                    # optional target model per role; a similar model is substituted if it is
# red-team = "<model id>"              # unavailable, and a weaker one needs the operator's confirmation

[budget]
mission_budget_usd = 5.0             # D-10: L1–L3 work (enforced with pre-dispatch cost reservations)
council_budget_usd = 20.0            # D-10: Council Mode
on_budget_exhausted = "escalate"     # halt node and ask the operator; never silently downscale
per_watch_max_wakes_per_day = 10

[hitl]
approval_timeout_sec = 600           # Unanswered approvals resolve to DENY

# Commands (D-24): the OS sandbox is optional. "off" (default): every command asks for approval unless an allow rule
# covers it; "prefer": use the sandbox when there is one (sandboxed commands need no approval); "required".
# This table is ratified: widening it is a Red-tier proposal. `delphi setup` fills in test_command for your project.
[exec]
sandbox = "off"
# allow = ["cargo test*"]            # commands that need no approval (patterns over the argv; `*` matches anything)
# deny = ["git push*"]               # commands that are refused outright
# test_command = ["cargo", "test"]   # merge gate 1
# check_command = ["cargo", "clippy"] # merge gate 2

[rag]
engine = "fts5"                      # D-01: BM25-only in v1; sqlite-hybrid (FTS5 + sqlite-vec + RRF) after the reopen trigger
max_pointer_results = 10
exclude_untrusted_by_default = true

[federation]
enabled = false
transport = "tailscale"              # tailscale | ssh-uds | mdns
default_peer_trust_ceiling = "federated_peer"

# ── Model access (specs/009). [[endpoints]], [access] and [auth.*] are ratified: changes are Red-tier proposals.
# [[endpoints]]
# id = "bedrock-us"
# family = "claude"
# path = "cloud"              # api | cloud | gateway-native | gateway-compat | harness
# platform = "bedrock"
# region = "us-east-1"
# credential = "aws:work-sso"
#
# [access]
# order = { claude = ["bedrock-us"] }
# allowed_endpoints = ["bedrock-us"]
#
# [auth.corp-okta]
# flow = "device_code"
# issuer = "https://idp.example.com"
# client_id = "<from your IdP admin>"
# scopes = ["llm.invoke"]

# ── Connectors (specs/010). [connectors.*] is ratified like [access]. Delphi ships no client IDs: create an OAuth
# client in your own Google Cloud project, then `delphi auth login google`, `delphi connectors test drive`,
# `delphi connectors pin drive`, and /ratify the pins. The server URLs below are reported, not confirmed: check them
# with `delphi connectors test` before relying on them.
# [auth.google]
# flow = "loopback_pkce"
# issuer = "https://accounts.google.com"
# client_id = "<from your Google Cloud project>"
# client_secret = "keychain:google-client-secret"
# scopes = ["openid", "email", "https://www.googleapis.com/auth/drive.readonly"]
# authorization_params = { access_type = "offline", prompt = "consent" }
#
# [connectors.drive]
# url = "https://drivemcp.googleapis.com/mcp"
# hosts = ["drivemcp.googleapis.com", "openidconnect.googleapis.com"]
# login = "google"
# account = "you@example.com"          # the login must resolve to this address, or it is discarded
# identity = "google"
# roles = ["orchestrator", "strategist"]
# tools = { search_files = "read", read_file = "read", list_folder = "read" }   # your allowlist and classification
# max_arg_chars = 128
# first_use = "ask"                    # "ask" or "allow" (Green for reads)
