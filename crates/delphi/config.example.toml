# ─────────────────────────────────────────────────────────────────────────────
# DELPHI WORKSPACE CONFIGURATION TEMPLATE (crates/delphi/config.example.toml)
# Seeded by `delphi init` into $DELPHI_HOME/workspaces/<name>/config.toml (never into a project repo).
# API keys are NEVER stored here: they live in macOS Keychain / Linux Secret Service,
# with the *_env variables below as fallback (specs/006 §2.2).
# ─────────────────────────────────────────────────────────────────────────────

[workspace]
name = "delphi"
projects = ["~/code/my-project"]         # project repos this workspace operates on (D-03)
untrusted_paths = ["vendor/**", "third_party/**", "node_modules/**"]  # tracked files here read as external_untrusted
isolated = false                     # true: nothing is ever promoted out of this workspace (specs/004 §5.4)

[privacy]
identifiers = []                     # repo names, hosts and terms that must never appear in operator-scope rules
default_mode = "orchestrator" # orchestrator | council

[theme]
name = "greek"                 # display names, window labels and persona voice only (specs/001 §6); behavior never depends on it

[tui]
auto_spawn_narrator = false   # Set true for automatic dual-window on launch
frame_rate_hz = 60
hide_bibliographies = true    # true (default): KB searches in console resolve to summary .md pages, not .bib.md sidecars (specs/075)

# Model tiers per family, and per-model limits and prices (specs/002 §4). The access path and
# credentials for each family are [[endpoints]] (specs/009, below). Fill in current model IDs and prices.
[models.claude]
fast = "<claude fast model id>"
workhorse = "<claude workhorse model id>"
frontier = "<claude frontier model id>"

[models.gemini]
fast = "<gemini fast model id>"
workhorse = "<gemini workhorse model id>"
frontier = "<gemini frontier model id>"

# [models.catalog."<model id>"]
# max_output_tokens = 64000
# min_thinking_budget = 1024
# max_thinking_budget = 32000
# context_tokens = 200000            # the context window; omit if unknown (routing never treats unknown as too small)
# thinking_in_max_tokens = true      # Claude: true; Gemini: false
# input_usd_per_mtok = 0.0
# cache_read_usd_per_mtok = 0.0
# cache_write_usd_per_mtok = 0.0
# output_usd_per_mtok = 0.0          # thinking is billed at the output rate

[agents]
# Operator direct interaction, fleet accessibility, and quarantine (specs/063 §3.1).
# The orchestrator has full visibility of all canonical and bundle specialist agents.
# Only interactive roles can be @-addressed directly by the operator on session start:
interactive = ["orchestrator"]
# Quarantined roles; orchestrator dispatch and direct interaction are strictly blocked:
# forbidden = []
# Fleet accessibility mode: "all" (default, all canonical roles + bundle agents visible to orchestrator)
# fleet = "all"
# Legacy fallback: enabled = [...] (treated as interactive if interactive is omitted)
enabled = ["orchestrator", "architect", "builder", "red-team", "strategist"]   # D-07 v1 roster

[events]
thinking_retention_days = 30         # D-16

[routing]
enable_dynamic_scaling = true
cross_provider_builder_critic = true # [H-007] Pair Claude builder with Gemini critic
max_attempts_per_node = 3            # Unified retry ladder (specs/003 §3.2): upscale, then reset, then escalate
max_parallel_agents = 4
# When no usable model is left, a task waits for one to return (and says so) instead of failing, and a
# weaker substitute is used only after you confirm it for that task (declining, or not answering, means waiting).
# degrade_prompt_secs = 300           # how long the "run on a weaker model?" card waits; no answer means look again, then ask again
# max_park_secs = 0                  # omit to wait as long as it takes; 0 = never wait (escalate at once); N = give up after N seconds

# Bundle agents (specs/041). "flat" (default): the orchestrator is shown one line per bundle agent, up to 20, and told how many
# are not listed. "auto": past 20 agents it is shown a short index of domains and gets the `search_agent_registry` tool instead.
# `delphi route "<task>"` shows what the search would return, without a model call.
# registry = "flat"

# Which role to adopt (specs/098 section 8). `route` (the MCP tool and `delphi route "<task>"`) ranks Delphi's canonical roles and the bundle
# agents together and gives each candidate a confidence from 0 to 1; a candidate at or above this has `adopt = true`, and below it a host adopts no
# role. The default is provisional: it was set on a small labeled set (`delphi route --adopt-eval <file>` measures your own).
# adopt_threshold = 0.55

# Hosts (specs/098). `[hosts] route_adopt` and `[hosts] source_ladder` were removed (specs/098 section 13.2): `route`'s `adopt` is always a
# recommendation, and the source ladder is always served (it is section 4 of the scout, investigator and red-team manifests).
# An old config that still has them is read without error; `delphi doctor` names them.

# Model assignment (specs/056). "static" (default): a role's tier picks the model, as always. "discovered": each dispatch is
# assigned by capability class (role floor and preferred class), measured results and quota, from the pool you ratified;
# a card only when no pool member meets a role's floor. `delphi capabilities --models` shows each model's class.
# assignment = "static"
# evidence_enough = 8                # measured results per (role, kind, model) after which a model is scored by them alone
# Emergency stop-gap (specs/056 §3.5; off unless both are set). A local model (an endpoint with cost_model = "local") that, only when every
# ratified seat is out of quota, reads and writes one hand-off record of the mission's state, marked unverified until a capable model re-checks it.
# It never serves ordinary work, approves, ratifies or leaves the sandbox.
# emergency_endpoint = "<local endpoint id>"
# emergency_model = "<model id>"
# [routing.reserve]                  # share of the mission budget no other role may spend (assignment = "discovered")
# validator = 0.15

# Promote and nerf (specs/056 §4; ratified): a role's grade from -2 to 2. `delphi agent promote|nerf <role>` proposes the edit; /ratify applies it.
# [grades]
# architect = 1
# [grades.builder]
# default = 0
# docs = -1

# Model pool (specs/002 §4.1, D-26: ratified). Models in preference order; when the first eligible
# model is exhausted (quota, subscription window or budget) the next one takes over and work continues.
# Roles ask for capabilities, never for a named model. Omit to use every configured tier, family by family.
# Each model expands to every allowed endpoint that serves it, and its state is kept per endpoint and
# model. `delphi models` shows where each stands; `delphi models --probe` re-checks them.
# [routing.pool]
# order = ["<claude frontier model id>", "<gemini frontier model id>", "<claude workhorse model id>"]
# throttle_attempts = 3                # this many throttles in a row ...
# throttle_window_secs = 600           # ... over at least this long count as a spent quota
# reprobe_first_secs = 900             # an exhausted model with no known reset time is probed after this ...
# reprobe_max_secs = 14400             # ... then at doubling intervals up to this
# [routing.targets]                    # optional target model per role; a similar model is substituted if it is
# red-team = "<model id>"              # unavailable, and a weaker one needs the operator's confirmation

[budget]
mission_budget_usd = 5.0             # D-10: L1–L3 work (enforced with pre-dispatch cost reservations)
council_budget_usd = 20.0            # D-10: Council Mode
on_budget_exhausted = "escalate"     # halt node and ask the operator; never silently downscale
per_watch_max_wakes_per_day = 10

# What a Council status call reports while seats work (specs/098 section 19).
# [council]
# stall_secs = 120                   # flag a Council `stalled` when every seat still working has been idle this long; 0 turns it off

# Foreign seats and model families (specs/091 SR-3, SR-4). A Panel's foreign seat is one Delphi runs itself on another model family.
# [seats]
# require_families = 2               # unset (default): never refuse; a result with fewer than two known families is labelled homogeneous
# max_foreign_seats = 1              # per Council; 0 turns the foreign seat off
# (`red_team_kind` was removed, specs/098 section 13.2: `council_open` always accepts `kind: red_team`.)
# max_foreign_tokens = 100000        # per Council: the foreign seat's token ceiling must fit under this, and Round 2 is skipped once Round 1 used it

# What the engine adds around a role's model calls (specs/045). Not an access table: it adds notes and one verification turn,
# never a tool or a permission. Every key shown is the default.
# [loop]
# nudge = true                       # tell a role that is going round in circles; end the span if it carries on
# nudge_edits = 4                    # writes to one file before the nudge (twice this ends the span)
# budget_warnings = true             # tell a role when 75 % and 90 % of its turns are used
# verify_gate = true                 # one check against the task before a role that writes or runs commands may finish
# workspace_bootstrap = true         # give a role with a worktree a map of it
# tool_result_limit_kb = 0           # a tool result over this size is stored; the history keeps a handle and a short preview (0 = off)
# clear_after_kb = 0                 # old tool results are replaced by a handle in batches of about this size (0 = off)
# trim_arguments_kb = 0              # old tool calls with arguments this large lose the bulk of them, kept at a handle (0 = off)
# keep_recent_turns = 6              # the newest assistant turns that clearing and trimming leave whole

[hitl]
approval_timeout_sec = 600           # Unanswered approvals resolve to DENY

# Commands (D-24): the OS sandbox is optional. "off" (default): every command asks for approval unless an allow rule
# covers it; "prefer": use the sandbox when there is one (sandboxed commands need no approval); "required".
# This table is ratified: widening it is a Red-tier proposal. `delphi setup` fills in test_command for your project.
[exec]
sandbox = "off"
# allow = ["cargo test*"]            # commands that need no approval (patterns over the argv; `*` matches anything)
# deny = ["git push*"]               # commands that are refused outright
# test_command = ["cargo", "test"]   # merge gate 1
# check_command = ["cargo", "clippy"] # merge gate 2
# shell = true                       # offer the `shell` tool (a full shell line); false keeps only `run_command`
# hard = ["git push*"]               # shell lines that are always Hard: a Red card, never auto-approved (specs/061)

# Releases (specs/036). Uncomment to make `delphi update` refuse any build that is not a signed release. This table is ratified:
# adding the line takes effect at once, and taking it out takes effect when you ratify the removal. Development builds and source
# builds are unsigned, so this is for installs that follow releases.
# [update]
# require_signed = true

# Learning loop (specs/031 section 3.6). Staged notes are kept for your review and never loaded into a prompt. Each number is clamped
# to a floor and ceiling the core sets; turning capture off is allowed, loading unratified content is not.
# [learning]
# capture = true                     # stage notes from denials, corrections, retries and escalations
# max_notes = 200                    # per mission, 10 to 1000; the oldest is dropped
# triggers = ["denied_card", "correction", "recovery", "escalation", "rejected_decision"]
# exposure_randomization = false    # opt in: withhold a new rule from about half of its first 20 tasks, to measure it (security and always rules never)
# retro_min_tasks = 10               # finished tasks before `delphi needs` says the coaching pass has material (3 to 200)

# Project history (specs/102 section 7). Your own prompts, redacted, with a capped summary of what came of each, kept on this machine
# only and never in a bundle, export or model prompt unless you say so. Pasted blocks are kept as a keyed hash and a length, not text.
# On by default (opt out), but nothing is recorded until a person has answered the install question once, in a terminal (`delphi init`, or
# the first `delphi` after an upgrade); an answer of no, `delphi history off` or `enabled = false` records nothing. Redaction is best effort.
# [history]
# enabled = true       # the default; false records nothing, whatever the question says
# paste_chars = 400    # a span longer than this is treated as pasted unless Delphi saw it typed (50 to 5000; a hypothesis)
# to_models = "deny"   # "allow" lets a seat of your host's own family read a record; a foreign or unknown family never does
# budget_mb = 50       # per project, 1 to 1024; at the cap Delphi stops adding and says so
# retention_days = 90  # 1 to 3650 (a hypothesis); nothing is deleted at this age: `delphi history status` counts the records past it
# timeline = true      # the daemon timeline and report (ids and counts only); it stays when records are off, false turns it off too
# Controls: `delphi history off` stops new records at once, `purge [--since <when>]` / `delete <id>` erase records and keep a tombstone, `status` shows what is stored.

# Delphi for the other tools you code with (specs/062): `delphi mcp` is an MCP server on stdio, for this machine and this user only.
# [mcp]
# enabled = true                     # false: every tool call is answered `disabled_by_operator`; read at each call, so it takes effect at once
# allow_remote = false               # reserved for a later spec; true is refused
# badge_style = "plain"             # plain | ansi | markdown: which form of a Delphi agent's identity (⟦•_•⟧ Name (role, via delphi)) the `display` and `signature` fields carry; every form is sent
# badge_mode = "dark"               # dark | light: the terminal background the ANSI form is coloured for (Delphi cannot see your terminal); plain and markdown carry no colour
# badge_ascii = false               # true: the badge in an identity is plain ASCII ([0-0] for ⟦•─•⟧), for a host whose font cannot draw it; DELPHI_ASCII_BADGES=1 does the same where Delphi itself runs
# max_packs_per_task = 5           # how many DIFFERENT generated packs (`spawn_agent_pack`) one named task may have; asking again for a pack already made costs nothing; 0 allows none (specs/098 section 9)
# max_packs_per_session = 20       # how many different generated packs one server session may have in all, so cycling task names cannot spawn packs without end; 0 allows none

# Model names for the council subagent files that `delphi mcp --install codex --agents` and `delphi plugin export` write (specs/086 section 6.3).
# Only Copilot and Codex take a free name; Claude Code and agy use aliases Delphi picks. No entry: the file sets no model and the seat inherits.
# [host.models.codex]
# architect = "your-strong-model"    # roles: architect, red-team, strategist, builder; give red-team a different model from architect
# red-team = "your-other-model"

# Knowledge retrieval for agents (specs/064).
# [retrieval]
# auto = true                        # a root span starts with at most 3 passages from the knowledge base; false: only when an agent calls kb_search

# Fact validator (specs/040 section 15.1). off: no fetch of any kind. advisory (default): the full fact path as a dry run; it uses the
# network, records what it would ratify and writes nothing validated. ratify: real writes, allowed only while the daemon's latch and the
# PROMOTE conditions permit; the effective mode is the lower of this value and the latch.
# [validator]
# mode = "advisory"
# weak_sources = "label"          # a claim only Weak sources support: "label" keeps it as unverified (weak), "off" refuses it
# background = false              # while the daemon is idle, check queued library claims in advisory mode (never ratifies); 100k tokens/day and 10% of the install's week at most (specs/040 18.3)
# [validator.sources]          # your additions to the default source list (registrable domains)
# primary = []
# reputable = []
# weak = []

# Generated search pages (specs/057). `delphi pages search "<question>"` has the writer role write a page from the library and checks it
# with the validator; a page is always labelled generated and not authoritative. external = "ask" searches the web only when you ask
# (--external); private sources never leave the install. A cache hit costs nothing; per_day caps the pages built in a day.
# [library.pages]
# enabled = true
# external = "ask"        # ask | off | on
# max_tokens = 3000
# external_ttl = "7d"     # a page that used the web is rebuilt after this
# per_day = 20
# min_ttl_days = 1        # the writer proposes how long a page stays fresh (specs/097); the daemon keeps it within these bounds
# max_ttl_days = 365

# Research (specs/028 section 10): the web search engines the archives pane's expand mode asks, in order, one at a time (the next only if
# the last failed). Ratified, because it names who receives your queries. Which sites may be read is context/sources/trusted.toml plus your
# own $DELPHI_HOME/operator/trusted-sources.toml. Unset: "parallel" (a hosted MCP search, no key or account, rate limited, sees the query
# text). providers = [] turns research off; providers = ["searxng"] keeps queries off any vendor.
# [search]
# providers = ["parallel", "brave", "searxng"]   # parallel | brave | mojeek | searxng | kagi | google (google only with a Gemini endpoint)
# [search.brave]
# credential = "env:BRAVE_API_KEY"
# [search.mojeek]
# credential = "env:MOJEEK_API_KEY"
# [search.searxng]
# url = "https://searx.example.org"

# What a research answer reports (specs/098 section 7.5). Every answer carries a coverage report per rung (knowledge base, trusted
# sources, close sources, the wider web) with what was found and kept. Fewer kept, cited claims than thin_below from the knowledge
# base and the trusted sources together make the answer say "coverage: thin" and name the host rungs that can take over. Default 3.
# [research]
# thin_below = 3
#
# Archived copies (specs/101 section 5). Off by default. With archive_fallback = true, when `delphi sources show` finds a PUBLIC source it
# fetched itself gone and holds no readable text, the daemon asks one web archive whether it has a copy and keeps it as a labelled version
# of the source ("Archived copy from <date>, not the live page"). Read-only: it only asks and reads, and never asks the archive to save a page.
# A private source, a record that cannot be read, and an address that is not public send nothing. A copy adds no origin and no trusted
# source to any claim; a claim resting on it reads "checked against an archived copy". `delphi sources archive <id | url>` does the same on
# your say-so whether or not this is on. The endpoint must be https.
# archive_fallback = false
# archive_endpoint = "https://archive.org/wayback/available"
#
# Citation chaining (specs/101 section 6). Off by default. With citation_chaining = true, a research run asks ONE citation index
# (OpenCitations' Index API) what each of the run's best public works cites and what cites it, and keeps the DOIs it names as "noted"
# leads (https://doi.org/<doi>, recorded and never fetched). What is sent is a public DOI of a source the daemon fetched itself, and
# nothing else: a source that is private, whose record cannot be read, or that names no DOI gives nothing to send, and neither does a
# claim that rests on one. The index's answer is read as data (only DOIs that parse); no link in it is followed. A chained find adds no
# origin to any claim and changes no status. The index answers [] both for "none" and for "no list", so the report says "not available
# for N works" when a seed had neither. The bounds are hypotheses to calibrate from the search log: levels followed (1 to 3), seed
# works a level (1 to 10), works kept per seed (1 to 50), calls to the index per run (1 to 200). The endpoint must be https.
# citation_chaining = false
# citation_endpoint = "https://api.opencitations.net/index/v2"
# chain_depth = 1
# chain_fanout = 2
# chain_max_per_seed = 10
# chain_max_calls = 30
#
# Read chained works as pages (specs/101 section 6 item 8): one request to the DOI-resolution endpoint per work, then one capture of the
# first https address it gives, kept as a `noted` source. chain_max_pages is how many works are read this way per run (1 to 50); the
# requests count against chain_max_calls. The endpoint is https only, without credentials, query or fragment.
# doi_endpoint = "https://doi.org/api/handles"
# chain_max_pages = 5
#
# The wider fetch (specs/098 section 7.5 item 7a), always on (the `ladder` flag was removed, section 13.2). Besides the trusted list, the
# daemon's fetch reaches any https URL that a search of the run returned (and, for a host's claim, a URL that an earlier search of the same
# host session returned), so a result from a site you have not listed can be read, kept as "noted", and checked. Nothing else is fetched: a URL
# a model or a host makes up is not in the set, a link found on a fetched page is never followed (7b is not built), a query string is
# never added, a redirect to another origin is not followed, and the fetcher's other rules stay (https, public addresses only, a size
# cap, the cloaking check). The status shows where each fetched URL came from. The two caps are hypotheses: distinct off-list pages per
# host and per run (1 to 100).
# fetch_per_host = 2
# fetch_per_run = 10
#
# How corroboration is counted (specs/098 section 7.6). A claim with three or more independent origins, counted by code over pages the
# daemon fetched itself, reads "corroborated": a weaker statement than "validated". Origins follow specs/040 section 6.2 (registrable
# domain, near-duplicate text, a page that cites another). A domain a list calls weak and every excluded one count zero; a domain no list
# names (unfamiliar) counts unless unfamiliar_counts is false. A registrable domain younger than young_domain_days counts zero when its age
# is known (nothing supplies an age yet); citations first seen within burst_hours of each other count once when their first-seen times
# are known; pages whose text is more similar than similar_above are one origin (never looser than specs/040's own 0.5).
# young_domain_days = 180
# burst_hours = 24
# similar_above = 0.8
# unfamiliar_counts = true
#
# A search log beside each host research result (specs/101 section 3). One line per search: of whom (the knowledge base, the trusted
# list, a search provider), why, the query that was sent (the same redacted string), when, and how many results came back and were
# kept, plus a found / duplicates / kept / not-kept flow that adds up. A search withheld because its claim rests on a private source says
# so and carries no query text; a search your host says it ran is logged as declared and counts as nothing. The log is private when
# any claim it served is, and never leaves this machine then. `delphi research log <id>` prints it. Always on (the `search_log` flag was
# removed, specs/098 section 13.2).
#
# Retraction check (specs/101 section 4). Off by default. With it on, a source that has a DOI is looked up in a LOCAL copy of the Retraction
# Watch data at capture and at re-check, and when you import a new copy. A retracted work stops counting as an independent origin and a
# claim only it supports reads contested; a work under an expression of concern stops counting too; a correction is only a label. Nothing
# is deleted: the capture stays readable, marked. Import the file you downloaded yourself (the repository is
# gitlab.com/crossref/retraction-watch-data) with `delphi research retractions import <file>`. Delphi makes no call to a service about a
# DOI, ever: a DOI would tell a third party what you are reading. A snapshot older than retractions_stale_days is called stale.
# retractions = false
# retractions_stale_days = 90
#
# The confidence ladder (specs/100 section 3.2). A claim's rung is derived by code from tags the daemon wrote: how many independent
# origins it has, how many of those are trusted sources, whether anything contradicts it, and whether the validator's dry run recorded
# "would_ratify". corroborated: corroborated_origins or more origins. substantiated: corroborated and substantiated_trusted or more trusted
# sources. vetted: vetted_origins or more origins, vetted_trusted or more trusted sources, and a would_ratify. All three read "not validated"
# (vetted reads "vetted") and each says it is weaker than "validated"; none grants a permission, a trust level or a promotion. The numbers are
# first guesses for you to calibrate. A contradiction or a lost source lowers a claim at once. A rung switched off is skipped: a claim reads
# the highest rung that is on (the audit's roll-back, specs/100 section 7, uses these switches).
# [research.tiers]
# corroborated_origins = 3
# substantiated_trusted = 1
# vetted_origins = 5
# vetted_trusted = 2
# corroborated_enabled = true
# substantiated_enabled = true
# vetted_enabled = true
# fast_lane_enabled = true            # the validator is offered a higher rung's claims first (queue order only; the claim's status never changes)

# Library acquisition (specs/055 section 8): once a day, the library scout proposes public-domain and research sources that match your projects
# and these interests, as ONE batch in the digest. Nothing is fetched until you accept (or a standing rule covers it). Ratified, because it
# names where the daemon fetches from (the archives in context/sources/archives.toml and your operator/archives.toml). Off by default.
# [library.acquire]
# enabled = false
# byte_budget_mib = 2048          # reaching it stops acquiring; nothing is evicted
# max_item_mib = 16
# batch_size = 8
# token_share_percent = 5         # the scout's share of the trailing week's tokens (at most 10); 0 = no model call
# interests = ["medieval siege engineering"]

[rag]
engine = "sqlite-hybrid"             # informational: FTS5 + sqlite-vec + RRF + reranker (spec 004). What runs depends on the models installed;
                                     # DELPHI_EMBED_MODEL=off / DELPHI_RERANK_MODEL=off / DELPHI_SEED_VECTORS=off switch each part off
max_pointer_results = 10
exclude_untrusted_by_default = true

[federation]
enabled = false
transport = "tailscale"              # tailscale | ssh-uds | mdns
default_peer_trust_ceiling = "federated_peer"

# ── Model access (specs/009). [[endpoints]], [access] and [auth.*] are ratified: changes are Red-tier proposals.
# [[endpoints]]
# id = "bedrock-us"
# family = "claude"
# path = "cloud"              # api | cloud | gateway-native | gateway-compat | harness
# platform = "bedrock"
# region = "us-east-1"
# credential = "aws:work-sso"
#
# A slow local fallback for when paid quota runs out (Ollama; free, nothing leaves the machine). Declare it AFTER the paid
# endpoints: the pool reaches families in declaration order. `credential = "none"` is accepted only for a loopback base_url.
# [[endpoints]]
# id = "ollama"
# family = "local"
# path = "gateway-compat"
# base_url = "http://localhost:11434"
# credential = "none"
# cost_model = "local"
# models = { fast = "qwen3:8b", workhorse = "qwen3:8b", frontier = "qwen3:8b" }
# [models.catalog."qwen3:8b"]
# max_output_tokens = 8192
#
# [access]
# order = { claude = ["bedrock-us"] }
# allowed_endpoints = ["bedrock-us"]
#
# [auth.corp-okta]
# flow = "device_code"
# issuer = "https://idp.example.com"
# client_id = "<from your IdP admin>"
# scopes = ["llm.invoke"]

# ── Subscription CLIs (specs/020). Nothing here is needed: with no [harness.claude] block, the values shown below ARE the
# defaults. Delphi's tools (timer, dispatch, scoped files, connectors) reach the Claude CLI over a per-span MCP bridge; for roles
# that do not edit files the CLI runs in its auto permission mode, so your organization's policy and the CLI's own classifier
# answer first and Delphi asks you only about what they cannot settle; the web tools and the account's own connectors are on.
# A block exists only to NARROW this, and like [access] it is ratified (Red tier). Builders always stay on Delphi's rules.
# `delphi doctor` and `delphi endpoints test --probe` show whether your organization's MCP policy lets the bridge load.
# The same block's keys apply to the Antigravity CLI as [harness.agy] where they can: `bridge` (a plugin carrying Delphi's tools
# and a hook that denies its other tools, in the span's own working directory), `native_tools` (the web tools the hook lets
# through: "WebSearch" and "WebFetch" become search_web and read_url_content) and `env_allow`. Its spans start untrusted (L0)
# and are never a Builder until `delphi endpoints test --probe` has watched the hook deny every kind of tool on the installed agy
# version; then they start trusted (falling to L0 when they read the web) and a Builder's file edits go through the hook and
# Delphi's approval cards, its commands through Delphi's own run_command tool.
# The Codex CLI is [harness.codex] (`harness = "codex"`, `family = "openai"` on the endpoint; specs/047 S1). A seat is read-only and
# untrusted (L0): `codex exec` in a read-only sandbox, nothing saved, your own ~/.codex config ignored, no Delphi tools, and never a
# Builder. Keys: `effort` ("low", "medium" or "high"), `json_schema`, `env_allow`. A key source as the endpoint's credential
# (`keychain:`, `env:`) runs it on CODEX_API_KEY; `harness-login` uses your ChatGPT sign-in.
# The GitHub Copilot CLI is [harness.copilot] (`harness = "copilot"` on the endpoint; specs/051 S1). One login serves several
# vendors' models, so name the model in `models` and set the endpoint's `family` to that model's vendor (`claude`, `gemini` or
# `openai`); an answer from a different model is refused, and `auto` is never used. A seat is read-only and untrusted (L0): no
# Delphi tools, no write or shell (the CLI denies them without an approver), a home inside the task's own scratch directory (so its saved
# session never lands in your ~/.copilot), and never a Builder. Keys: `effort`, `env_allow`, `quota_source`. A key source as the credential (`keychain:`, `env:`) runs it on COPILOT_GITHUB_TOKEN (a
# fine-grained token with "Copilot Requests"); `harness-login` uses the login `copilot login` stored in your keychain.
# `quota_source = "gh"` lets `delphi doctor` show the account's plan and pool through your `gh` login (an undocumented endpoint); off by default.
# [harness.claude]
# bridge = true                        # false: roles without a worktree run text-only (no timer, dispatch or file tools)
# approvals = "delegate"               # "delphi": Delphi's own tiers and cards answer every request instead
# native_tools = ["WebSearch", "WebFetch"]   # the CLI's own tools for roles without a worktree (what they fetch is untrusted); [] for none
# claudeai_connectors = true           # false: only Delphi's bridge is loaded (the account's connectors and your own MCP servers stay out)
# connector_reads = []                 # with approvals = "delphi": exact names like "mcp__claude_ai_Slack__slack_search" that only read; any other connector tool is a Red card
# env_allow = []                       # extra environment variable NAMES passed to the CLI (for example "AWS_PROFILE"); never values
# [harness]
# connector_settle_secs = 10           # how long a span waits for the account's connectors to finish loading before its first turn

# ── Connectors (specs/010). [connectors.*] is ratified like [access]. Delphi ships no client IDs: create an OAuth
# client in your own Google Cloud project, then `delphi auth login google`, `delphi connectors test drive`,
# `delphi connectors pin drive`, and /ratify the pins. The server URLs below are reported, not confirmed: check them
# with `delphi connectors test` before relying on them.
# [auth.google]
# flow = "loopback_pkce"
# issuer = "https://accounts.google.com"
# client_id = "<from your Google Cloud project>"
# client_secret = "keychain:google-client-secret"
# scopes = ["openid", "email", "https://www.googleapis.com/auth/drive.readonly"]
# authorization_params = { access_type = "offline", prompt = "consent" }
#
# [connectors.drive]
# url = "https://drivemcp.googleapis.com/mcp"
# hosts = ["drivemcp.googleapis.com", "openidconnect.googleapis.com"]
# login = "google"
# account = "you@example.com"          # the login must resolve to this address, or it is discarded
# identity = "google"
# roles = ["orchestrator", "strategist"]
# tools = { search_files = "read", read_file = "read", list_folder = "read" }   # your allowlist and classification
# max_arg_chars = 128
# first_use = "ask"                    # "ask" or "allow" (Green for reads)
