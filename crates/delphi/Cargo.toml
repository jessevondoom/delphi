[package]
name = "delphi"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Delphi: terminal-first multi-agent working environment (roadmap Step 1: init, doctor, lint)"
license = "UNLICENSED"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
blake3 = "1.5"
walkdir = "2.4"
regex = "1.9"
libc = "0.2"
include_dir = "0.7"
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.8"
