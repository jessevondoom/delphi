[package]
name = "delphi"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Delphi: terminal-first multi-agent working environment (roadmap Step 1: init, doctor, lint)"
license = "MIT"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
delphi-sandbox = { path = "../delphi-sandbox" }
delphi-engine = { path = "../delphi-engine" }
delphi-adapter = { path = "../delphi-adapter" }
delphi-xenia = { path = "../delphi-xenia" }
delphi-bundle = { path = "../delphi-bundle" }
semver = "1"
toml_edit = "0.25"
flate2 = "1"
tar = "0.4"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = "1.0"
toml = "1.1"
blake3 = "1.5"
walkdir = "2.4"
regex = "1.9"
libc = "0.2"
include_dir = "0.7"
anyhow = "1.0"
ratatui = "0.29"
unicode-width = "0.2"
mail-parser = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }
ignore = "0.4"

[features]
# Compile the models and preloaded vectors named by DELPHI_EMBED_MODEL_FILE, DELPHI_RERANK_MODEL_FILE and
# DELPHI_SEED_VECTORS_FILE into the executable (the release build; specs/004 §3.5 to §3.7).
embedded-model = ["delphi-engine/embedded-model"]

[dev-dependencies]
delphi-release = { path = "../delphi-release" }
delphi-core = { path = "../delphi-core", features = ["test-support"] }
delphi-xenia = { path = "../delphi-xenia", features = ["test-support"] }
vt100 = "0.15"
serde_json = "1.0"
tempfile = "3.8"
jsonschema = { version = "0.30", default-features = false }
