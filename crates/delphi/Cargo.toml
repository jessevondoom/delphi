[package]
name = "delphi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Delphi: terminal-first multi-agent working environment (roadmap Step 1: init, doctor, lint)"
license = "MIT"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
delphi-sandbox = { path = "../delphi-sandbox" }
delphi-engine = { path = "../delphi-engine" }
delphi-adapter = { path = "../delphi-adapter" }
toml_edit = "0.25"
flate2 = "1"
tar = "0.4"
sha2 = "0.11.0"
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
serde_json = "1.0"
toml = "1.1"
blake3 = "1.5"
walkdir = "2.4"
regex = "1.9"
libc = "0.2"
include_dir = "0.7"
anyhow = "1.0"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.8"
