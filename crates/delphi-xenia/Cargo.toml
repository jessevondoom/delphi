[package]
name = "delphi-xenia"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Xenia: the org-level signed memory store (specs/011, specs/012). Pure verification code: no network, no model calls."
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
blake3 = "1.8.7"
ed25519-dalek = "2"
bs58 = "0.5"
getrandom = "0.3"
# pins.toml (state/pins.toml, spec 011 §3.3); the same parser the rest of the workspace uses.
toml = "1.1"

[features]
# Test-only: the signed-roster builder in `testkit`, for other crates' tests (as delphi-docs does).
test-support = []

[dev-dependencies]
tempfile = "3.8"
