# GPT-OSS through agy: OpenAI's open-weight lineage. agy has no premium-request multiplier, so `multiplier` is 0 (not metered that
# way) and `price_category` is empty. Its budget is agy's silent cut (above), not the model's: tail delivered at 100 KB, lost at
# 200 KB and 400 KB. Under `--json-schema` it nested the JSON as a string inside `answer`.
[[model]]
id = "gpt-oss-120b-medium"
carrier = "agy"
vendor = "openai"
family = "openai"
multiplier = 0.0
price_category = ""
prompt_budget_tokens = 47000
bytes_per_token = 0.0
tail_tested_tokens = 0
json_in_text = "nested-string"
note = "budget is agy's silent ~47k-token cut; tail delivered at 100 KB, lost at 200 KB with status SUCCESS"
