[package]
name = "delphi-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Delphi engine: tools, approvals and the agent loop (roadmap Step 2)"
license = "UNLICENSED"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
delphi-adapter = { path = "../delphi-adapter" }
delphi-sandbox = { path = "../delphi-sandbox" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
blake3 = "1.5"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
walkdir = "2"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "1.1"

[[bin]]
name = "delphi-core"
path = "src/bin/delphi-core.rs"

[dev-dependencies]
delphi-core = { path = "../delphi-core", features = ["test-support"] }
tempfile = "3.8"
libc = "0.2"
