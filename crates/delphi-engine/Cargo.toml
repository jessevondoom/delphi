[package]
name = "delphi-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Delphi engine: tools, approvals and the agent loop (roadmap Step 2)"
license = "MIT"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
delphi-adapter = { path = "../delphi-adapter" }
delphi-sandbox = { path = "../delphi-sandbox" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
blake3 = "1.5"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }
walkdir = "2"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sqlite-vec = "0.1.9"
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }

# Apple's Accelerate does the matrix products on macOS; elsewhere candle's own kernels are used.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate", "metal"], optional = true }
candle-nn = { version = "0.11", features = ["accelerate", "metal"], optional = true }
candle-transformers = { version = "0.11", features = ["accelerate", "metal"], optional = true }
accelerate-src = { version = "0.3", optional = true }

[features]
default = ["local-embeddings"]
# The embedding model runtime (specs/004 §3.5). Without it the knowledge base is lexical only.
local-embeddings = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:accelerate-src"]
# Compile the model package named by DELPHI_EMBED_MODEL_FILE into the binary (the release build does this).
embedded-model = ["local-embeddings"]

[[bin]]
name = "delphi-core"
path = "src/bin/delphi-core.rs"

[dev-dependencies]
delphi-core = { path = "../delphi-core", features = ["test-support"] }
tempfile = "3.8"
libc = "0.2"
