[package]
name = "delphi-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Delphi engine: tools, approvals and the agent loop (roadmap Step 2)"
license = "UNLICENSED"
publish = false

[dependencies]
delphi-core = { path = "../delphi-core" }
delphi-adapter = { path = "../delphi-adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
blake3 = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.8"
