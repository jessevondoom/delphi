# Which group each spec belongs to, and the closed list of groups (spec 088, OD-4: approved 2026-11-07).
#
# Hand-written; the compiler (`delphi specs compile`) never writes this file. It is the only place a spec's group is declared:
# a `group:` line in a spec's frontmatter is ignored, because editing an approved spec would change its hash. The compile fails
# when a spec is missing from `[specs]`, when `[specs]` names a spec that has no file, or when a spec names a group that is not
# listed below. Specs are named by file stem (never by a bare number). A new spec adds one line here in the pull request that
# creates it. Changing a group is a one-line edit followed by `delphi specs compile`.

