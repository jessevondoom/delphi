# The default trusted-source list (specs/028 section 10.3). A source is on this list only because the operator ratified it:
# the research job of the archives pane reads these hosts and no others. A change is a pull request the operator approves.
# The operator's own additions live in $DELPHI_HOME/operator/trusted-sources.toml and are added to this list.
#
# host         an exact domain; it matches that domain and its subdomains. "*.gov" matches any host that ends in ".gov".
# kind         standards | government | journal | encyclopedia | documentation | news
# licence      an SPDX id, or "unknown" (treated as summary-only)
# reuse        "full" may store the page as markdown (when the page carries no stricter notice); "summary-only" stores a summary and facts
# share_alike  the licence requires derivative text to carry the same licence

[[source]]
host = "en.wikipedia.org"
publisher = "Wikipedia"
kind = "encyclopedia"
licence = "CC-BY-SA-4.0"
reuse = "full"
share_alike = true

[[source]]
host = "developer.mozilla.org"
publisher = "MDN Web Docs"
kind = "documentation"
licence = "CC-BY-SA-2.5"
reuse = "full"
share_alike = true

