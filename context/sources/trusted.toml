# ── encyclopedias ───────────────────────────────────────────────────────────

# Wikipedia is a pointer to primary sources more than evidence (spec 040 classes it Weak); it is here because it is the
# fastest way to find the references the job then follows. Its entries are marked `encyclopedia` so that spec 040 can still
# treat them as a pointer. Share-alike: an export of the collection must carry the licence.
[[source]]
host = "en.wikipedia.org"
publisher = "Wikimedia Foundation"
kind = "encyclopedia"
licence = "CC-BY-SA-4.0"
reuse = "full"

[[source]]
host = "britannica.com"
publisher = "Encyclopaedia Britannica"
kind = "encyclopedia"
licence = "unknown"
reuse = "summary-only"

